<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="500" fill="#FAFAF8"/>

  <!-- タイトル -->
  <text x="600" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#1F1F1F">手動マッチング vs 自動マッチング機能：3軸比較</text>

  <!-- 左カラム：手動マッチング -->
  <!-- カードの背景 -->
  <rect x="60" y="80" width="480" height="360" rx="16" fill="#F3F0FF" stroke="#9333EA" stroke-width="2"/>
  <rect x="60" y="80" width="480" height="56" rx="16" fill="#9333EA"/>
  <rect x="60" y="120" width="480" height="16" rx="0" fill="#9333EA"/>
  <text x="300" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">手動マッチング（現状）</text>

  <!-- 軸1: 処理時間 -->
  <text x="100" y="190" font-size="15" font-weight="700" fill="#374151">⏱ 処理時間（1件あたり）</text>
  <rect x="100" y="205" width="400" height="28" rx="6" fill="#E9D5FF"/>
  <rect x="100" y="205" width="340" height="28" rx="6" fill="#9333EA" opacity="0.7"/>
  <text x="450" y="224" text-anchor="end" font-size="14" font-weight="700" fill="#5B21B6">15〜30分</text>

  <!-- 軸2: 候補精度 -->
  <text x="100" y="275" font-size="15" font-weight="700" fill="#374151">🎯 候補精度（担当者間の均質性）</text>
  <rect x="100" y="290" width="400" height="28" rx="6" fill="#E9D5FF"/>
  <rect x="100" y="290" width="200" height="28" rx="6" fill="#9333EA" opacity="0.7"/>
  <text x="450" y="309" text-anchor="end" font-size="14" font-weight="700" fill="#5B21B6">担当者による差が大</text>

  <!-- 軸3: 担当者負荷 -->
  <text x="100" y="360" font-size="15" font-weight="700" fill="#374151">💼 担当者の作業負荷</text>
  <rect x="100" y="375" width="400" height="28" rx="6" fill="#E9D5FF"/>
  <rect x="100" y="375" width="380" height="28" rx="6" fill="#9333EA" opacity="0.7"/>
  <text x="450" y="394" text-anchor="end" font-size="14" font-weight="700" fill="#5B21B6">高い（台帳の目視確認）</text>

  <!-- 総評 -->
  <text x="300" y="445" text-anchor="middle" font-size="14" fill="#5B21B6" font-weight="700">登録者数の増加とともに破綻リスクが拡大</text>

  <!-- 右カラム：自動マッチング -->
  <rect x="660" y="80" width="480" height="360" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <rect x="660" y="80" width="480" height="56" rx="16" fill="#D97706"/>
  <rect x="660" y="120" width="480" height="16" rx="0" fill="#D97706"/>
  <text x="900" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">自動マッチング機能（導入後）</text>

  <!-- 軸1: 処理時間 -->
  <text x="700" y="190" font-size="15" font-weight="700" fill="#374151">⏱ 処理時間（1件あたり）</text>
  <rect x="700" y="205" width="400" height="28" rx="6" fill="#FDE68A"/>
  <rect x="700" y="205" width="60" height="28" rx="6" fill="#D97706"/>
  <text x="1050" y="224" text-anchor="end" font-size="14" font-weight="700" fill="#92400E">数秒〜即時</text>

  <!-- 軸2: 候補精度 -->
  <text x="700" y="275" font-size="15" font-weight="700" fill="#374151">🎯 候補精度（担当者間の均質性）</text>
  <rect x="700" y="290" width="400" height="28" rx="6" fill="#FDE68A"/>
  <rect x="700" y="290" width="360" height="28" rx="6" fill="#D97706"/>
  <text x="1050" y="309" text-anchor="end" font-size="14" font-weight="700" fill="#92400E">均質・条件定義に基づき一定</text>

  <!-- 軸3: 担当者負荷 -->
  <text x="700" y="360" font-size="15" font-weight="700" fill="#374151">💼 担当者の作業負荷</text>
  <rect x="700" y="375" width="400" height="28" rx="6" fill="#FDE68A"/>
  <rect x="700" y="375" width="100" height="28" rx="6" fill="#D97706"/>
  <text x="1050" y="394" text-anchor="end" font-size="14" font-weight="700" fill="#92400E">低い（確認・最終判断のみ）</text>

  <!-- 総評 -->
  <text x="900" y="445" text-anchor="middle" font-size="14" fill="#92400E" font-weight="700">登録者数が増えても作業量は変わらない</text>

  <!-- 中央の矢印 -->
  <polygon points="580,240 620,240 600,280" fill="#374151" opacity="0.7"/>
  <line x1="600" y1="220" x2="600" y2="300" stroke="#374151" stroke-width="2" opacity="0.5"/>
</svg>
