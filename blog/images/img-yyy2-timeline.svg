<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&amp;display=swap');
    text { font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="480" fill="#FAFAF7"/>

  <!-- Title -->
  <text x="600" y="46" text-anchor="middle" font-size="22" font-weight="900" fill="#1A1A1A">FDE継続発注によるAI内製化の進捗タイムライン</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#6B7280">月1〜2日のスポット発注を積み重ねることで6ヶ月後には社内でAIが当たり前になる</text>

  <!-- Timeline base line -->
  <line x1="80" y1="230" x2="1120" y2="230" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>

  <!-- Arrow at end -->
  <polygon points="1120,220 1140,230 1120,240" fill="#D97706"/>

  <!-- Month markers - 5 milestones -->

  <!-- Month 1 -->
  <circle cx="160" cy="230" r="18" fill="#065F46" stroke="#fff" stroke-width="3"/>
  <text x="160" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="160" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">1ヶ月目</text>
  <!-- Above line content -->
  <rect x="75" y="90" width="170" height="105" rx="10" fill="#065F46" opacity="0.07" stroke="#065F46" stroke-width="1.5"/>
  <text x="160" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">初回発注</text>
  <text x="160" y="135" text-anchor="middle" font-size="11" fill="#374151">業務を1つ選定</text>
  <text x="160" y="153" text-anchor="middle" font-size="11" fill="#374151">発注ブリーフを作成</text>
  <text x="160" y="171" text-anchor="middle" font-size="11" fill="#374151">初日から実装開始</text>
  <line x1="160" y1="195" x2="160" y2="212" stroke="#065F46" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Month 2 -->
  <circle cx="360" cy="230" r="18" fill="#D97706" stroke="#fff" stroke-width="3"/>
  <text x="360" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="360" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">2ヶ月目</text>
  <!-- Below line content -->
  <rect x="275" y="295" width="170" height="100" rx="10" fill="#D97706" opacity="0.08" stroke="#D97706" stroke-width="1.5"/>
  <line x1="360" y1="248" x2="360" y2="295" stroke="#D97706" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="360" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#D97706">成果の共有</text>
  <text x="360" y="342" text-anchor="middle" font-size="11" fill="#374151">「週2時間削減」を社内共有</text>
  <text x="360" y="360" text-anchor="middle" font-size="11" fill="#374151">他部門から問い合わせ</text>
  <text x="360" y="378" text-anchor="middle" font-size="11" fill="#374151">候補リスト更新</text>

  <!-- Month 3 -->
  <circle cx="560" cy="230" r="18" fill="#065F46" stroke="#fff" stroke-width="3"/>
  <text x="560" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  <text x="560" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">3ヶ月目</text>
  <!-- Above line content -->
  <rect x="475" y="90" width="170" height="105" rx="10" fill="#065F46" opacity="0.07" stroke="#065F46" stroke-width="1.5"/>
  <text x="560" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">2部門目へ展開</text>
  <text x="560" y="135" text-anchor="middle" font-size="11" fill="#374151">新しい業務にも発注</text>
  <text x="560" y="153" text-anchor="middle" font-size="11" fill="#374151">稼働日数を月2日に増加</text>
  <text x="560" y="171" text-anchor="middle" font-size="11" fill="#374151">ブリーフの精度が向上</text>
  <line x1="560" y1="195" x2="560" y2="212" stroke="#065F46" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Month 4-5 -->
  <circle cx="760" cy="230" r="18" fill="#D97706" stroke="#fff" stroke-width="3"/>
  <text x="760" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4-5</text>
  <text x="760" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">4〜5ヶ月目</text>
  <!-- Below line content -->
  <rect x="675" y="295" width="170" height="100" rx="10" fill="#D97706" opacity="0.08" stroke="#D97706" stroke-width="1.5"/>
  <line x1="760" y1="248" x2="760" y2="295" stroke="#D97706" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="760" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#D97706">定期発注の確立</text>
  <text x="760" y="342" text-anchor="middle" font-size="11" fill="#374151">翌月枠を先に仮確保</text>
  <text x="760" y="360" text-anchor="middle" font-size="11" fill="#374151">AI活用が月次ルーティン化</text>
  <text x="760" y="378" text-anchor="middle" font-size="11" fill="#374151">予算確保も容易に</text>

  <!-- Month 6 -->
  <circle cx="980" cy="230" r="20" fill="#B45309" stroke="#fff" stroke-width="3"/>
  <text x="980" y="236" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">6+</text>
  <text x="980" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">6ヶ月以降</text>
  <!-- Above line content - highlighted -->
  <rect x="880" y="78" width="200" height="118" rx="10" fill="#B45309" opacity="0.10" stroke="#B45309" stroke-width="2"/>
  <text x="980" y="104" text-anchor="middle" font-size="13" font-weight="900" fill="#B45309">🎯 AI内製化完成</text>
  <text x="980" y="124" text-anchor="middle" font-size="11" fill="#374151">社内全体でAIが普通に</text>
  <text x="980" y="142" text-anchor="middle" font-size="11" fill="#374151">AI活用レポートを作成</text>
  <text x="980" y="160" text-anchor="middle" font-size="11" fill="#374151">成果を経営層へ報告</text>
  <text x="980" y="178" text-anchor="middle" font-size="11" fill="#374151">採用検討の判断材料に</text>
  <line x1="980" y1="196" x2="980" y2="210" stroke="#B45309" stroke-width="2" stroke-dasharray="4,3"/>
</svg>
