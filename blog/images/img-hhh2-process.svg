<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP', sans-serif">
  <!-- Background -->
  <rect width="1200" height="500" fill="#F8FAFF"/>

  <!-- Title -->
  <text x="600" y="46" text-anchor="middle" font-size="22" font-weight="900" fill="#1e293b">資格証明書管理のBefore → After比較</text>

  <!-- BEFORE Column -->
  <rect x="40" y="70" width="510" height="400" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="40" y="70" width="510" height="52" rx="16" fill="#ef4444"/>
  <rect x="40" y="106" width="510" height="16" rx="0" fill="#ef4444"/>
  <text x="295" y="103" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">❌ Before（手作業・目視管理）</text>

  <!-- Before items -->
  <rect x="72" y="140" width="446" height="70" rx="10" fill="#FEF2F2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="295" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">📄 証明書受領</text>
  <text x="295" y="186" text-anchor="middle" font-size="13" fill="#7f1d1d">メール・郵送・持参がバラバラ → 受領確認が分散</text>

  <text x="295" y="225" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>

  <rect x="72" y="240" width="446" height="70" rx="10" fill="#FEF2F2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="295" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">📝 手入力・転記</text>
  <text x="295" y="286" text-anchor="middle" font-size="13" fill="#7f1d1d">Excelに手動入力 → 転記ミス・入力漏れが発生</text>

  <text x="295" y="325" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>

  <rect x="72" y="340" width="446" height="70" rx="10" fill="#FEF2F2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="295" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">📅 リマインド管理</text>
  <text x="295" y="386" text-anchor="middle" font-size="13" fill="#7f1d1d">担当者の記憶・カレンダー頼り → 繁忙期に漏れ</text>

  <!-- Warning label -->
  <rect x="72" y="424" width="446" height="34" rx="8" fill="#ef4444"/>
  <text x="295" y="446" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">更新漏れリスク・法的リスク・担当者依存</text>

  <!-- Arrow between columns -->
  <text x="600" y="280" text-anchor="middle" font-size="48" fill="#1D4ED8">→</text>

  <!-- AFTER Column -->
  <rect x="650" y="70" width="510" height="400" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="650" y="70" width="510" height="52" rx="16" fill="#1D4ED8"/>
  <rect x="650" y="106" width="510" height="16" rx="0" fill="#1D4ED8"/>
  <text x="905" y="103" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">✅ After（AI-OCR×kintone連携）</text>

  <!-- After items -->
  <rect x="682" y="140" width="446" height="70" rx="10" fill="#EFF6FF" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="905" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">🤖 AI-OCR 自動読み取り</text>
  <text x="905" y="186" text-anchor="middle" font-size="13" fill="#1e3a8a">PDF・画像を自動解析 → 氏名・資格種別・有効期限を抽出</text>

  <text x="905" y="225" text-anchor="middle" font-size="22" fill="#1D4ED8">↓</text>

  <rect x="682" y="240" width="446" height="70" rx="10" fill="#EFF6FF" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="905" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">🗂 kintone 自動登録・一元管理</text>
  <text x="905" y="286" text-anchor="middle" font-size="13" fill="#1e3a8a">抽出データをkintoneに自動書き込み → 常時最新状態</text>

  <text x="905" y="325" text-anchor="middle" font-size="22" fill="#1D4ED8">↓</text>

  <rect x="682" y="340" width="446" height="70" rx="10" fill="#DCFCE7" stroke="#86efac" stroke-width="1.5"/>
  <text x="905" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">📬 自動リマインドメール</text>
  <text x="905" y="386" text-anchor="middle" font-size="13" fill="#14532d">90日前・60日前・30日前に医師＋担当者へ自動送信</text>

  <!-- Success label -->
  <rect x="682" y="424" width="446" height="34" rx="8" fill="#16A34A"/>
  <text x="905" y="446" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">更新漏れゼロ・担当者異動の影響なし・転記ミスなし</text>
</svg>
