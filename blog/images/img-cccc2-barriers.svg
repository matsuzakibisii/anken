<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" width="1200" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&amp;display=swap');
      text { font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#F0FDF4"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" font-size="22" font-weight="900" fill="#1E3A5F">PAD導入でよくある3つの壁と、スポット外注による解決効果</text>

  <!-- Bar chart background panel -->
  <rect x="60" y="80" width="1080" height="320" rx="12" fill="#ffffff" stroke="#D1FAE5" stroke-width="1.5"/>

  <!-- Y axis label -->
  <text x="80" y="108" font-size="13" fill="#6B7280">工数削減率（自動化後）</text>

  <!-- Grid lines -->
  <line x1="140" y1="110" x2="1100" y2="110" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="140" y1="160" x2="1100" y2="160" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="140" y1="210" x2="1100" y2="210" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="140" y1="260" x2="1100" y2="260" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="140" y1="310" x2="1100" y2="310" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="140" y1="360" x2="1100" y2="360" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Y axis labels -->
  <text x="130" y="114" text-anchor="end" font-size="13" fill="#9CA3AF">100%</text>
  <text x="130" y="164" text-anchor="end" font-size="13" fill="#9CA3AF">80%</text>
  <text x="130" y="214" text-anchor="end" font-size="13" fill="#9CA3AF">60%</text>
  <text x="130" y="264" text-anchor="end" font-size="13" fill="#9CA3AF">40%</text>
  <text x="130" y="314" text-anchor="end" font-size="13" fill="#9CA3AF">20%</text>
  <text x="130" y="364" text-anchor="end" font-size="13" fill="#9CA3AF">0%</text>

  <!-- Bar 1: Excel転記 -->
  <rect x="180" y="128" width="140" height="232" rx="6" fill="#059669"/>
  <text x="250" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#059669">95%</text>
  <text x="250" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Excel転記・</text>
  <text x="250" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">コピペ作業</text>

  <!-- Bar 2: ファイル操作 -->
  <rect x="380" y="148" width="140" height="212" rx="6" fill="#059669" opacity="0.85"/>
  <text x="450" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#059669">87%</text>
  <text x="450" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">ファイル整理・</text>
  <text x="450" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">フォルダ移動</text>

  <!-- Bar 3: ブラウザ操作 -->
  <rect x="580" y="185" width="140" height="175" rx="6" fill="#1E3A5F"/>
  <text x="650" y="177" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">72%</text>
  <text x="650" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Webフォーム・</text>
  <text x="650" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">ブラウザ操作</text>

  <!-- Bar 4: レポート出力 -->
  <rect x="780" y="168" width="140" height="192" rx="6" fill="#1E3A5F" opacity="0.75"/>
  <text x="850" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">80%</text>
  <text x="850" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">定型レポート・</text>
  <text x="850" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">メール送信</text>

  <!-- Bar 5: データ確認 -->
  <rect x="980" y="208" width="100" height="152" rx="6" fill="#6EE7B7"/>
  <text x="1030" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">62%</text>
  <text x="1030" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">データ照合・</text>
  <text x="1030" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">確認作業</text>

  <!-- X axis line -->
  <line x1="140" y1="360" x2="1100" y2="360" stroke="#D1D5DB" stroke-width="2"/>

  <!-- Legend -->
  <rect x="300" y="448" width="16" height="16" rx="3" fill="#059669"/>
  <text x="322" y="461" font-size="13" fill="#374151">PAD自動化で削減率が高い業務</text>
  <rect x="620" y="448" width="16" height="16" rx="3" fill="#1E3A5F"/>
  <text x="642" y="461" font-size="13" fill="#374151">中程度の削減効果</text>
  <rect x="840" y="448" width="16" height="16" rx="3" fill="#6EE7B7"/>
  <text x="862" y="461" font-size="13" fill="#374151">ケースによって変動</text>

  <!-- Note -->
  <text x="600" y="492" text-anchor="middle" font-size="11" fill="#9CA3AF">※ 削減率は業務内容・システム環境によって異なります。ANKENスポット外注実績に基づく目安値。</text>
</svg>
