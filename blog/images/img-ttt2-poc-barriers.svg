<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" style="font-family:'Noto Sans JP',sans-serif;">
  <!-- 背景 -->
  <rect width="1200" height="520" fill="#F8F3FF" rx="16"/>

  <!-- タイトル -->
  <text x="600" y="50" text-anchor="middle" font-size="23" font-weight="900" fill="#3B0764">AI導入PoC停滞の3つの壁とFDEが解決できること</text>

  <!-- 列見出しバー（問題 vs 解決） -->
  <rect x="40" y="70" width="349" height="36" fill="#7C3AED" rx="6"/>
  <text x="214" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">壁①｜技術の壁</text>

  <rect x="428" y="70" width="349" height="36" fill="#7C3AED" rx="6"/>
  <text x="602" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">壁②｜データの壁</text>

  <rect x="816" y="70" width="349" height="36" fill="#7C3AED" rx="6"/>
  <text x="990" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">壁③｜組織の壁</text>

  <!-- カード1 -->
  <rect x="40" y="115" width="349" height="180" fill="#FFFFFF" rx="12" stroke="#DDD6FE" stroke-width="2"/>
  <text x="56" y="146" font-size="13" font-weight="700" fill="#6D28D9">▼ よくある停滞パターン</text>
  <text x="56" y="170" font-size="13" fill="#374151">PoC環境のAIモデルは動くが、</text>
  <text x="56" y="190" font-size="13" fill="#374151">本番APIへの移行・エラー処理・</text>
  <text x="56" y="210" font-size="13" fill="#374151">セキュリティ設計ができるエンジ</text>
  <text x="56" y="230" font-size="13" fill="#374151">ニアが社内にいない。外注先も</text>
  <text x="56" y="250" font-size="13" fill="#374151">PoC後の移行を得意としない。</text>
  <text x="56" y="278" font-size="12" fill="#9CA3AF">例：精度90%のAIモデルがあるのに本番化できず2年放置</text>

  <!-- カード2 -->
  <rect x="428" y="115" width="349" height="180" fill="#FFFFFF" rx="12" stroke="#DDD6FE" stroke-width="2"/>
  <text x="444" y="146" font-size="13" font-weight="700" fill="#6D28D9">▼ よくある停滞パターン</text>
  <text x="444" y="170" font-size="13" fill="#374151">PoC用のサンプルデータはあるが、</text>
  <text x="444" y="190" font-size="13" fill="#374151">本番の実業務データ（ERPや基幹</text>
  <text x="444" y="210" font-size="13" fill="#374151">システム）との接続設計・前処理</text>
  <text x="444" y="230" font-size="13" fill="#374151">パイプラインが未整備で、実データ</text>
  <text x="444" y="250" font-size="13" fill="#374151">で動かすと精度が大幅に落ちる。</text>
  <text x="444" y="278" font-size="12" fill="#9CA3AF">例：実業務データで試したら精度が60%に下落</text>

  <!-- カード3 -->
  <rect x="816" y="115" width="349" height="180" fill="#FFFFFF" rx="12" stroke="#DDD6FE" stroke-width="2"/>
  <text x="832" y="146" font-size="13" font-weight="700" fill="#6D28D9">▼ よくある停滞パターン</text>
  <text x="832" y="170" font-size="13" fill="#374151">PoCのプロジェクトオーナーが別</text>
  <text x="832" y="190" font-size="13" fill="#374151">プロジェクトに異動、または次期</text>
  <text x="832" y="210" font-size="13" fill="#374151">予算に先送り。KPI・費用対効果・</text>
  <text x="832" y="230" font-size="13" fill="#374151">社内承認フローが未設計のまま</text>
  <text x="832" y="250" font-size="13" fill="#374151">プロジェクトが自然消滅する。</text>
  <text x="832" y="278" font-size="12" fill="#9CA3AF">例：「PoC完了」で予算打ち切り、翌期に再提案で塩漬け</text>

  <!-- FDE解決策バー -->
  <rect x="40" y="308" width="349" height="36" fill="#059669" rx="6"/>
  <text x="214" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">✓ FDEが解決できること</text>

  <rect x="428" y="308" width="349" height="36" fill="#059669" rx="6"/>
  <text x="602" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">✓ FDEが解決できること</text>

  <rect x="816" y="308" width="349" height="36" fill="#059669" rx="6"/>
  <text x="990" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">✓ FDEが解決できること</text>

  <!-- 解決策カード1 -->
  <rect x="40" y="352" width="349" height="148" fill="#ECFDF5" rx="12" stroke="#6EE7B7" stroke-width="2"/>
  <text x="56" y="380" font-size="13" fill="#064E3B">本番API移行・MLOps設計・エラー</text>
  <text x="56" y="400" font-size="13" fill="#064E3B">ハンドリング・セキュリティ実装を</text>
  <text x="56" y="420" font-size="13" fill="#064E3B">一体で担当。PoC環境のコードを</text>
  <text x="56" y="440" font-size="13" fill="#064E3B">本番グレードに書き直す「LLMOps」</text>
  <text x="56" y="460" font-size="13" fill="#064E3B">作業も守備範囲内。</text>
  <text x="56" y="488" font-size="12" fill="#059669" font-weight="700">費用目安：20〜50万円（1〜2ヶ月）</text>

  <!-- 解決策カード2 -->
  <rect x="428" y="352" width="349" height="148" fill="#ECFDF5" rx="12" stroke="#6EE7B7" stroke-width="2"/>
  <text x="444" y="380" font-size="13" fill="#064E3B">本番データのクレンジング・前処理</text>
  <text x="444" y="400" font-size="13" fill="#064E3B">パイプライン設計・ERP/基幹システ</text>
  <text x="444" y="420" font-size="13" fill="#064E3B">ムとのAPI連携を設計。実業務デー</text>
  <text x="444" y="440" font-size="13" fill="#064E3B">タでの精度検証と再チューニングを</text>
  <text x="444" y="460" font-size="13" fill="#064E3B">スポット期間内に完結させる。</text>
  <text x="444" y="488" font-size="12" fill="#059669" font-weight="700">費用目安：30〜60万円（2〜3ヶ月）</text>

  <!-- 解決策カード3 -->
  <rect x="816" y="352" width="349" height="148" fill="#ECFDF5" rx="12" stroke="#6EE7B7" stroke-width="2"/>
  <text x="832" y="380" font-size="13" fill="#064E3B">KPI設定・費用対効果シナリオ・</text>
  <text x="832" y="400" font-size="13" fill="#064E3B">社内承認資料を作成。現場担当者</text>
  <text x="832" y="420" font-size="13" fill="#064E3B">への操作トレーニングと運用定着</text>
  <text x="832" y="440" font-size="13" fill="#064E3B">フォローを実施し、「使われる仕組み」</text>
  <text x="832" y="460" font-size="13" fill="#064E3B">として引き渡す。</text>
  <text x="832" y="488" font-size="12" fill="#059669" font-weight="700">費用目安：15〜40万円（1〜2ヶ月）</text>
</svg>
