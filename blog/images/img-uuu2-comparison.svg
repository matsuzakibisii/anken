<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" width="1200" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&amp;display=swap');
      text { font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#f9f7f4"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">従来の人的対応 vs AI自動応対　能力比較</text>

  <!-- Column Headers -->
  <!-- Check items column -->
  <text x="180" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">比較項目</text>

  <!-- Traditional column -->
  <rect x="330" y="66" width="240" height="38" rx="6" fill="#e5e7eb"/>
  <text x="450" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">従来の人的対応</text>

  <!-- AI column -->
  <rect x="600" y="66" width="240" height="38" rx="6" fill="#0F766E" rx="6"/>
  <text x="720" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">AI自動応対</text>

  <!-- Notes column -->
  <text x="960" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">効果・補足</text>

  <!-- Divider line -->
  <line x1="60" y1="108" x2="1140" y2="108" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Row 1: 対応時間帯 -->
  <rect x="60" y="112" width="1080" height="52" rx="0" fill="#ffffff"/>
  <text x="180" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">対応時間帯</text>
  <!-- Traditional -->
  <rect x="355" y="120" width="190" height="30" rx="5" fill="#fee2e2"/>
  <text x="450" y="140" text-anchor="middle" font-size="13" fill="#991b1b">営業時間内のみ</text>
  <!-- AI -->
  <rect x="625" y="120" width="190" height="30" rx="5" fill="#d1fae5"/>
  <text x="720" y="140" text-anchor="middle" font-size="13" fill="#065f46">24時間365日</text>
  <!-- Note -->
  <text x="960" y="143" text-anchor="middle" font-size="12" fill="#4b5563">深夜・早朝の問い合わせにも即対応</text>
  <line x1="60" y1="164" x2="1140" y2="164" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Row 2: 応答速度 -->
  <rect x="60" y="164" width="1080" height="52" rx="0" fill="#f8fafc"/>
  <text x="180" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">応答速度</text>
  <!-- Traditional -->
  <rect x="355" y="172" width="190" height="30" rx="5" fill="#fee2e2"/>
  <text x="450" y="192" text-anchor="middle" font-size="13" fill="#991b1b">数分〜十数分</text>
  <!-- AI -->
  <rect x="625" y="172" width="190" height="30" rx="5" fill="#d1fae5"/>
  <text x="720" y="192" text-anchor="middle" font-size="13" fill="#065f46">数秒以内</text>
  <!-- Note -->
  <text x="960" y="195" text-anchor="middle" font-size="12" fill="#4b5563">待ち時間ゼロで顧客満足度向上</text>
  <line x1="60" y1="216" x2="1140" y2="216" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Row 3: 同時対応件数 -->
  <rect x="60" y="216" width="1080" height="52" rx="0" fill="#ffffff"/>
  <text x="180" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">同時対応件数</text>
  <!-- Traditional -->
  <rect x="355" y="224" width="190" height="30" rx="5" fill="#fee2e2"/>
  <text x="450" y="244" text-anchor="middle" font-size="13" fill="#991b1b">1件（電話）〜数件</text>
  <!-- AI -->
  <rect x="625" y="224" width="190" height="30" rx="5" fill="#d1fae5"/>
  <text x="720" y="244" text-anchor="middle" font-size="13" fill="#065f46">無制限</text>
  <!-- Note -->
  <text x="960" y="247" text-anchor="middle" font-size="12" fill="#4b5563">繁忙期のスパイクに対応可能</text>
  <line x1="60" y1="268" x2="1140" y2="268" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Row 4: スタッフ負担 -->
  <rect x="60" y="268" width="1080" height="52" rx="0" fill="#f8fafc"/>
  <text x="180" y="299" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">スタッフ負担</text>
  <!-- Traditional -->
  <rect x="355" y="276" width="190" height="30" rx="5" fill="#fee2e2"/>
  <text x="450" y="296" text-anchor="middle" font-size="13" fill="#991b1b">全件対応で疲弊・離職</text>
  <!-- AI -->
  <rect x="625" y="276" width="190" height="30" rx="5" fill="#d1fae5"/>
  <text x="720" y="296" text-anchor="middle" font-size="13" fill="#065f46">複雑案件のみに集中</text>
  <!-- Note -->
  <text x="960" y="299" text-anchor="middle" font-size="12" fill="#4b5563">定型対応から解放・離職率改善</text>
  <line x1="60" y1="320" x2="1140" y2="320" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Row 5: 多言語対応 -->
  <rect x="60" y="320" width="1080" height="52" rx="0" fill="#ffffff"/>
  <text x="180" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">多言語対応</text>
  <!-- Traditional -->
  <rect x="355" y="328" width="190" height="30" rx="5" fill="#fee2e2"/>
  <text x="450" y="348" text-anchor="middle" font-size="13" fill="#991b1b">担当者のスキル次第</text>
  <!-- AI -->
  <rect x="625" y="328" width="190" height="30" rx="5" fill="#fef3c7"/>
  <text x="720" y="348" text-anchor="middle" font-size="13" fill="#92400e">設定次第で対応可能</text>
  <!-- Note -->
  <text x="960" y="351" text-anchor="middle" font-size="12" fill="#4b5563">英・中・韓など主要言語に対応可</text>
  <line x1="60" y1="372" x2="1140" y2="372" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Row 6: ランニングコスト -->
  <rect x="60" y="372" width="1080" height="52" rx="0" fill="#f8fafc"/>
  <text x="180" y="403" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">ランニングコスト</text>
  <!-- Traditional -->
  <rect x="355" y="380" width="190" height="30" rx="5" fill="#fee2e2"/>
  <text x="450" y="400" text-anchor="middle" font-size="13" fill="#991b1b">人件費・残業代が増加</text>
  <!-- AI -->
  <rect x="625" y="380" width="190" height="30" rx="5" fill="#d1fae5"/>
  <text x="720" y="400" text-anchor="middle" font-size="13" fill="#065f46">月額1〜5万円（SaaS）</text>
  <!-- Note -->
  <text x="960" y="403" text-anchor="middle" font-size="12" fill="#4b5563">件数が増えても追加コストなし</text>
  <line x1="60" y1="424" x2="1140" y2="424" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Footer note -->
  <text x="600" y="462" text-anchor="middle" font-size="12" fill="#6b7280">※ AI自動応対は定型問い合わせの7〜8割が対象。複雑な案件はスタッフへ自動転送。</text>

  <!-- Legend -->
  <rect x="680" y="474" width="14" height="14" rx="3" fill="#d1fae5"/>
  <text x="698" y="486" font-size="11" fill="#374151">AI優位</text>
  <rect x="750" y="474" width="14" height="14" rx="3" fill="#fee2e2"/>
  <text x="768" y="486" font-size="11" fill="#374151">課題あり</text>
  <rect x="820" y="474" width="14" height="14" rx="3" fill="#fef3c7"/>
  <text x="838" y="486" font-size="11" fill="#374151">条件次第</text>
</svg>
