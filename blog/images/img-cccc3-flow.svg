<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" width="1200" height="480">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&amp;display=swap');
      text { font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="#F0FDF4"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-size="22" font-weight="900" fill="#1E3A5F">PADシナリオ作成　スポット外注　Q&amp;A形式フロー</text>

  <!-- Q&A Bubble 1 -->
  <!-- Q bubble (left, user) -->
  <rect x="30" y="80" width="460" height="80" rx="20" fill="#1E3A5F"/>
  <polygon points="480,110 510,100 480,130" fill="#1E3A5F"/>
  <text x="250" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Q. 社内にPADが使える人材がいない。</text>
  <text x="250" y="136" text-anchor="middle" font-size="14" fill="#D1FAE5">どこに頼めばいいですか？</text>
  <text x="42" y="72" font-size="11" fill="#6B7280">発注者の声</text>

  <!-- A bubble (right, ANKEN) -->
  <rect x="530" y="80" width="640" height="80" rx="20" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <polygon points="530,110 502,100 530,130" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="850" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">A. ANKENでPAD経験のあるスポットエンジニアを</text>
  <text x="850" y="132" text-anchor="middle" font-size="14" fill="#374151">ご紹介します。操作記録シート1枚あれば発注できます。</text>
  <text x="1158" y="72" text-anchor="end" font-size="11" fill="#6B7280">ANKENの回答</text>

  <!-- Q&A Bubble 2 -->
  <rect x="30" y="195" width="460" height="80" rx="20" fill="#1E3A5F"/>
  <polygon points="480,225 510,215 480,245" fill="#1E3A5F"/>
  <text x="250" y="227" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Q. シナリオを作ってもらった後、</text>
  <text x="250" y="251" text-anchor="middle" font-size="14" fill="#D1FAE5">保守はどうすればいいですか？</text>

  <rect x="530" y="195" width="640" height="80" rx="20" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <polygon points="530,225 502,215 530,245" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="850" y="223" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">A. 月1〜2日の保守リテイナー契約がおすすめです。</text>
  <text x="850" y="247" text-anchor="middle" font-size="14" fill="#374151">突発停止時の緊急対応枠も確保できます（月5〜15万円）。</text>

  <!-- Q&A Bubble 3 -->
  <rect x="30" y="310" width="460" height="80" rx="20" fill="#1E3A5F"/>
  <polygon points="480,340 510,330 480,360" fill="#1E3A5F"/>
  <text x="250" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Q. 最初の1本だけ試しに作ってもらえますか？</text>
  <text x="250" y="366" text-anchor="middle" font-size="14" fill="#D1FAE5">どこまで対応してもらえますか？</text>

  <rect x="530" y="310" width="640" height="80" rx="20" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <polygon points="530,340 502,330 530,360" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="850" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">A. はい、1〜2日の単発スポットから発注できます。</text>
  <text x="850" y="362" text-anchor="middle" font-size="14" fill="#374151">成果物はシナリオファイル＋操作マニュアルが標準です。</text>

  <!-- Bottom CTA hint -->
  <rect x="280" y="415" width="640" height="44" rx="22" fill="#059669"/>
  <text x="600" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">→ ANKENで無料相談・見積もりを依頼する</text>

  <!-- Note -->
  <text x="600" y="470" text-anchor="middle" font-size="11" fill="#9CA3AF">※ 費用・対応期間は業務内容・複雑さによって異なります。詳細はお問い合わせください。</text>
</svg>
