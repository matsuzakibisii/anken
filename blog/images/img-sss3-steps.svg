<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP', sans-serif">
  <!-- Background -->
  <rect width="1200" height="480" fill="#fafafa" rx="16"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="900" fill="#1f2937">ヘルパーマッチングAI化　スポット外注3ステップ</text>

  <!-- Step connectors (lines between circles) -->
  <line x1="338" y1="168" x2="462" y2="168" stroke="#d1d5db" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="738" y1="168" x2="862" y2="168" stroke="#d1d5db" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Step 1 -->
  <!-- Circle -->
  <circle cx="200" cy="168" r="52" fill="#E11D48" opacity="0.12"/>
  <circle cx="200" cy="168" r="40" fill="#E11D48"/>
  <text x="200" y="160" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">STEP</text>
  <text x="200" y="182" text-anchor="middle" font-size="28" fill="#ffffff" font-weight="900">1</text>

  <!-- Step 1 card -->
  <rect x="60" y="238" width="280" height="200" rx="12" fill="#ffffff" stroke="#E11D48" stroke-width="2"/>
  <rect x="60" y="238" width="280" height="52" rx="12" fill="#E11D48"/>
  <rect x="60" y="266" width="280" height="24" fill="#E11D48"/>
  <text x="200" y="270" text-anchor="middle" font-size="16" font-weight="900" fill="#ffffff">現状業務の要件化</text>

  <text x="90" y="314" font-size="14" fill="#374151" font-weight="700">担当者へのヒアリング</text>
  <text x="90" y="336" font-size="13" fill="#6b7280">相性判定の条件軸を明文化</text>
  <text x="90" y="362" font-size="14" fill="#374151" font-weight="700">ヘルパー・利用者数の整理</text>
  <text x="90" y="384" font-size="13" fill="#6b7280">既存システムの構成を確認</text>
  <text x="90" y="418" font-size="13" fill="#E11D48" font-weight="700">⏱ 1〜2週間</text>

  <!-- Step 2 -->
  <circle cx="600" cy="168" r="52" fill="#E11D48" opacity="0.12"/>
  <circle cx="600" cy="168" r="40" fill="#E11D48"/>
  <text x="600" y="160" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">STEP</text>
  <text x="600" y="182" text-anchor="middle" font-size="28" fill="#ffffff" font-weight="900">2</text>

  <!-- Step 2 card -->
  <rect x="460" y="238" width="280" height="200" rx="12" fill="#ffffff" stroke="#E11D48" stroke-width="2"/>
  <rect x="460" y="238" width="280" height="52" rx="12" fill="#E11D48"/>
  <rect x="460" y="266" width="280" height="24" fill="#E11D48"/>
  <text x="600" y="270" text-anchor="middle" font-size="16" font-weight="900" fill="#ffffff">AIマッチング機能の開発</text>

  <text x="490" y="314" font-size="14" fill="#374151" font-weight="700">スポット外注でAI APIを開発</text>
  <text x="490" y="336" font-size="13" fill="#6b7280">費用15〜50万円が目安</text>
  <text x="490" y="362" font-size="14" fill="#374151" font-weight="700">既存システムへの追加接続</text>
  <text x="490" y="384" font-size="13" fill="#6b7280">CSV/APIで連携レイヤーを構築</text>
  <text x="490" y="418" font-size="13" fill="#E11D48" font-weight="700">⏱ 4〜8週間</text>

  <!-- Step 3 -->
  <circle cx="1000" cy="168" r="52" fill="#16A34A" opacity="0.12"/>
  <circle cx="1000" cy="168" r="40" fill="#16A34A"/>
  <text x="1000" y="160" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">STEP</text>
  <text x="1000" y="182" text-anchor="middle" font-size="28" fill="#ffffff" font-weight="900">3</text>

  <!-- Step 3 card -->
  <rect x="860" y="238" width="280" height="200" rx="12" fill="#ffffff" stroke="#16A34A" stroke-width="2"/>
  <rect x="860" y="238" width="280" height="52" rx="12" fill="#16A34A"/>
  <rect x="860" y="266" width="280" height="24" fill="#16A34A"/>
  <text x="1000" y="270" text-anchor="middle" font-size="16" font-weight="900" fill="#ffffff">連携・本格運用開始</text>

  <text x="890" y="314" font-size="14" fill="#374151" font-weight="700">シフト表自動反映・勤怠連携</text>
  <text x="890" y="336" font-size="13" fill="#6b7280">承認フローを残しながら自動化</text>
  <text x="890" y="362" font-size="14" fill="#374151" font-weight="700">国保連請求データ自動生成</text>
  <text x="890" y="384" font-size="13" fill="#6b7280">月次請求工数を大幅削減</text>
  <text x="890" y="418" font-size="13" fill="#16A34A" font-weight="700">⏱ 試験運用1〜2ヶ月で精度検証</text>

  <!-- Arrow heads (triangles) -->
  <polygon points="462,158 462,178 480,168" fill="#9ca3af"/>
  <polygon points="862,158 862,178 880,168" fill="#9ca3af"/>

  <!-- Footer label -->
  <text x="600" y="460" text-anchor="middle" font-size="13" fill="#9ca3af">ANKENでは訪問介護・障害福祉業界のシステム開発経験があるスポットエンジニアをご紹介しています</text>
</svg>
