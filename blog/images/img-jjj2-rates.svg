<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP', sans-serif">
  <!-- Background -->
  <rect width="1200" height="500" fill="#FAFFFE" rx="16"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#0D9488">FDE副業の時給相場（スキルレベル別・2026年）</text>
  <text x="600" y="76" text-anchor="middle" font-size="14" fill="#6B7280">ANKENスポット案件データより</text>

  <!-- Grid lines -->
  <line x1="260" y1="110" x2="1100" y2="110" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="260" y1="160" x2="1100" y2="160" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="260" y1="210" x2="1100" y2="210" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="260" y1="260" x2="1100" y2="260" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="260" y1="310" x2="1100" y2="310" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="260" y1="360" x2="1100" y2="360" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="260" y1="410" x2="1100" y2="410" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Y-axis labels (time hours scale) -->
  <text x="248" y="415" text-anchor="end" font-size="13" fill="#9CA3AF">¥3,000</text>
  <text x="248" y="361" text-anchor="end" font-size="13" fill="#9CA3AF">¥6,000</text>
  <text x="248" y="311" text-anchor="end" font-size="13" fill="#9CA3AF">¥9,000</text>
  <text x="248" y="261" text-anchor="end" font-size="13" fill="#9CA3AF">¥12,000</text>
  <text x="248" y="211" text-anchor="end" font-size="13" fill="#9CA3AF">¥15,000</text>
  <text x="248" y="161" text-anchor="end" font-size="13" fill="#9CA3AF">¥18,000</text>
  <text x="248" y="111" text-anchor="end" font-size="13" fill="#9CA3AF">¥21,000</text>

  <!-- Y-axis line -->
  <line x1="260" y1="100" x2="260" y2="418" stroke="#D1D5DB" stroke-width="2"/>
  <!-- X-axis line -->
  <line x1="260" y1="418" x2="1100" y2="418" stroke="#D1D5DB" stroke-width="2"/>

  <!-- Bar 1: AIを「使える」 3,000〜6,000 -->
  <!-- Scale: 21,000 range mapped to 310px (100〜410) -->
  <!-- 3000 = 410 - (3000/21000)*310 = 410 - 44.3 = 365.7 -->
  <!-- 6000 = 410 - (6000/21000)*310 = 410 - 88.6 = 321.4 -->
  <rect x="300" y="321" width="150" height="97" fill="#0D9488" opacity="0.25" rx="4"/>
  <rect x="300" y="321" width="150" height="44" fill="#0D9488" rx="4"/>
  <!-- range bar -->
  <rect x="300" y="321" width="150" height="97" fill="#0D9488" opacity="0.6" rx="4"/>
  <text x="375" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#0D9488">¥3,000〜6,000</text>
  <text x="375" y="318" text-anchor="middle" font-size="11" fill="#6B7280">時給</text>
  <text x="375" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">① AIを「使える」</text>
  <text x="375" y="468" text-anchor="middle" font-size="11" fill="#6B7280">プロンプト設計・研修</text>

  <!-- Bar 2: AIを「設定・連携できる」 5,000〜10,000 -->
  <!-- 5000 = 410 - (5000/21000)*310 = 410 - 73.8 = 336.2 -->
  <!-- 10000 = 410 - (10000/21000)*310 = 410 - 147.6 = 262.4 -->
  <rect x="490" y="262" width="150" height="156" fill="#EAB308" opacity="0.6" rx="4"/>
  <text x="565" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#B45309">¥5,000〜10,000</text>
  <text x="565" y="260" text-anchor="middle" font-size="11" fill="#6B7280">時給</text>
  <text x="565" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">② AIを「設定・連携できる」</text>
  <text x="565" y="468" text-anchor="middle" font-size="11" fill="#6B7280">API接続・ノーコード連携</text>

  <!-- Bar 3: AIを「実装できる」 8,000〜15,000 -->
  <!-- 8000 = 410 - (8000/21000)*310 = 410 - 118 = 292 -->
  <!-- 15000 = 410 - (15000/21000)*310 = 410 - 221.4 = 188.6 -->
  <rect x="680" y="189" width="150" height="221" fill="#0D9488" opacity="0.75" rx="4"/>
  <text x="755" y="169" text-anchor="middle" font-size="18" font-weight="700" fill="#0D9488">¥8,000〜15,000</text>
  <text x="755" y="187" text-anchor="middle" font-size="11" fill="#6B7280">時給</text>
  <text x="755" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">③ AIを「実装できる」</text>
  <text x="755" y="468" text-anchor="middle" font-size="11" fill="#6B7280">RAG・LLMエージェント</text>

  <!-- Bar 4: 業界専門知識×AI実装 10,000〜20,000 -->
  <!-- 10000 = 410 - 147.6 = 262.4 -->
  <!-- 20000 = 410 - (20000/21000)*310 = 410 - 295.2 = 114.8 -->
  <rect x="870" y="115" width="150" height="295" fill="#EAB308" opacity="0.85" rx="4"/>
  <!-- Star / badge -->
  <circle cx="945" cy="108" r="18" fill="#EAB308"/>
  <text x="945" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="white">★</text>
  <text x="945" y="95" text-anchor="middle" font-size="18" font-weight="700" fill="#B45309">¥10,000〜20,000</text>
  <text x="945" y="78" text-anchor="middle" font-size="11" fill="#6B7280">時給（最高単価帯）</text>
  <text x="945" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">④ 業界専門知識×AI実装</text>
  <text x="945" y="468" text-anchor="middle" font-size="11" fill="#6B7280">医療・製造・士業 等</text>

  <!-- Arrow trend indicator -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0D9488" opacity="0.5"/>
    </marker>
  </defs>
  <path d="M 375,370 Q 565,320 755,240 Q 870,195 945,160" stroke="#0D9488" stroke-width="2.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow)" opacity="0.5"/>
</svg>
