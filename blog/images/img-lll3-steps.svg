<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" style="font-family:'Noto Sans JP',sans-serif;">
  <!-- Background -->
  <rect width="1200" height="480" fill="#FAFAF7"/>

  <!-- Title -->
  <text x="600" y="44" text-anchor="middle" font-size="22" font-weight="900" fill="#1E1B4B">スポット外注でノウハウAIチャット化を進める3ステップ</text>

  <!-- Step 1 Box -->
  <rect x="50" y="80" width="320" height="340" rx="14" fill="#3730A3"/>
  <!-- Step badge -->
  <circle cx="210" cy="122" r="28" fill="#D97706"/>
  <text x="210" y="130" text-anchor="middle" font-size="19" font-weight="900" fill="#FFFFFF">1</text>
  <text x="210" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">ノウハウ</text>
  <text x="210" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">ヒアリング・データ化</text>
  <!-- Icon area -->
  <rect x="80" y="205" width="260" height="60" rx="8" fill="#4338CA"/>
  <text x="210" y="230" text-anchor="middle" font-size="12" fill="#C7D2FE">スポット外注で依頼する内容</text>
  <text x="210" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">インタビュー設計・実施・文書化</text>
  <!-- Details -->
  <text x="210" y="290" text-anchor="middle" font-size="12" fill="#E0E7FF">対象：シニア社員3〜5名</text>
  <text x="210" y="310" text-anchor="middle" font-size="12" fill="#E0E7FF">インタビュー：10〜25時間</text>
  <text x="210" y="330" text-anchor="middle" font-size="12" fill="#E0E7FF">Q&amp;A：50〜500問作成</text>
  <!-- Duration / Cost -->
  <rect x="80" y="350" width="260" height="54" rx="8" fill="#D97706"/>
  <text x="210" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">期間：2〜4週間</text>
  <text x="210" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">費用：10〜25万円</text>

  <!-- Arrow 1→2 -->
  <polygon points="395,250 425,270 395,290" fill="#D97706"/>
  <line x1="370" y1="270" x2="395" y2="270" stroke="#D97706" stroke-width="3"/>

  <!-- Step 2 Box -->
  <rect x="440" y="80" width="320" height="340" rx="14" fill="#3730A3"/>
  <circle cx="600" cy="122" r="28" fill="#D97706"/>
  <text x="600" y="130" text-anchor="middle" font-size="19" font-weight="900" fill="#FFFFFF">2</text>
  <text x="600" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">AIチャット</text>
  <text x="600" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">システム構築</text>
  <rect x="470" y="205" width="260" height="60" rx="8" fill="#4338CA"/>
  <text x="600" y="230" text-anchor="middle" font-size="12" fill="#C7D2FE">スポット外注で依頼する内容</text>
  <text x="600" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">RAG構築・チャットUI実装</text>
  <text x="600" y="290" text-anchor="middle" font-size="12" fill="#E0E7FF">RAGシステム構築</text>
  <text x="600" y="310" text-anchor="middle" font-size="12" fill="#E0E7FF">スマホ対応チャットUI</text>
  <text x="600" y="330" text-anchor="middle" font-size="12" fill="#E0E7FF">既存文書との統合</text>
  <rect x="470" y="350" width="260" height="54" rx="8" fill="#D97706"/>
  <text x="600" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">期間：2〜4週間</text>
  <text x="600" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">費用：15〜50万円</text>

  <!-- Arrow 2→3 -->
  <polygon points="785,250 815,270 785,290" fill="#D97706"/>
  <line x1="760" y1="270" x2="785" y2="270" stroke="#D97706" stroke-width="3"/>

  <!-- Step 3 Box -->
  <rect x="830" y="80" width="320" height="340" rx="14" fill="#3730A3"/>
  <circle cx="990" cy="122" r="28" fill="#D97706"/>
  <text x="990" y="130" text-anchor="middle" font-size="19" font-weight="900" fill="#FFFFFF">3</text>
  <text x="990" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">試験運用・</text>
  <text x="990" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">継続改善</text>
  <rect x="860" y="205" width="260" height="60" rx="8" fill="#4338CA"/>
  <text x="990" y="230" text-anchor="middle" font-size="12" fill="#C7D2FE">スポット外注で依頼する内容</text>
  <text x="990" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">精度確認・データ追記・チューニング</text>
  <text x="990" y="290" text-anchor="middle" font-size="12" fill="#E0E7FF">回答精度の現場確認</text>
  <text x="990" y="310" text-anchor="middle" font-size="12" fill="#E0E7FF">不足ノウハウの追加ヒアリング</text>
  <text x="990" y="330" text-anchor="middle" font-size="12" fill="#E0E7FF">利用ログ分析・改善提案</text>
  <rect x="860" y="350" width="260" height="54" rx="8" fill="#D97706"/>
  <text x="990" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">月次：1〜3日稼働</text>
  <text x="990" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">月額：3〜10万円</text>

  <!-- Bottom note -->
  <text x="600" y="450" text-anchor="middle" font-size="13" fill="#475569">※ フェーズ単位でスポット外注。予算・進捗に合わせて柔軟にペースを調整できます</text>
</svg>
