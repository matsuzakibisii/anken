<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP', sans-serif">
  <!-- Background -->
  <rect width="1200" height="500" fill="#0F172A" rx="16"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#F1F5F9">AI導入の2フェーズとFDEが担う「定着フェーズ」の位置づけ</text>

  <!-- Phase Labels -->
  <!-- Phase 1 box -->
  <rect x="60" y="76" width="500" height="52" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="310" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#94A3B8">① 導入フェーズ（ツール選定・実装）</text>
  <text x="310" y="130" text-anchor="middle" font-size="13" fill="#64748B">技術ベンダー・SIer 主導</text>

  <!-- Phase 2 box -->
  <rect x="640" y="76" width="500" height="52" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
  <text x="890" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#06B6D4">② 定着フェーズ（現場浸透・業務組み込み）</text>
  <text x="890" y="130" text-anchor="middle" font-size="13" fill="#38BDF8">FDE 主導のスポット外注エリア</text>

  <!-- Phase divider arrow -->
  <line x1="600" y1="76" x2="600" y2="460" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- AI活用度 Y-axis -->
  <text x="38" y="164" text-anchor="middle" font-size="13" fill="#64748B" transform="rotate(-90, 38, 300)">AI活用度（現場利用率）</text>
  <line x1="88" y1="160" x2="88" y2="440" stroke="#475569" stroke-width="1.5"/>
  <text x="82" y="168" text-anchor="end" font-size="12" fill="#64748B">高</text>
  <text x="82" y="438" text-anchor="end" font-size="12" fill="#64748B">低</text>

  <!-- X-axis time -->
  <line x1="88" y1="440" x2="1140" y2="440" stroke="#475569" stroke-width="1.5"/>
  <text x="614" y="472" text-anchor="middle" font-size="13" fill="#64748B">時間（導入後経過）</text>

  <!-- X-axis time markers -->
  <text x="88" y="458" text-anchor="middle" font-size="12" fill="#64748B">導入</text>
  <text x="300" y="458" text-anchor="middle" font-size="12" fill="#64748B">1ヶ月</text>
  <text x="600" y="458" text-anchor="middle" font-size="12" fill="#94A3B8" font-weight="600">3ヶ月</text>
  <text x="900" y="458" text-anchor="middle" font-size="12" fill="#06B6D4" font-weight="600">6ヶ月</text>
  <text x="1100" y="458" text-anchor="middle" font-size="12" fill="#06B6D4">12ヶ月</text>

  <!-- Pattern 1: 失敗パターン（FDEなし）-->
  <!-- Initial rise then sharp fall -->
  <polyline points="88,400 200,260 350,240 450,270 600,380 750,410 900,420 1100,430"
            fill="none" stroke="#EF4444" stroke-width="3" stroke-dasharray="8,4" opacity="0.8"/>

  <!-- Pattern 2: FDE活用パターン -->
  <!-- Rise then plateau with FDE intervention at 3 months -->
  <polyline points="88,400 200,260 350,240 480,250 600,230 680,190 780,170 900,155 1000,145 1100,140"
            fill="none" stroke="#06B6D4" stroke-width="4"/>

  <!-- FDE介入ポイント marker -->
  <circle cx="600" cy="230" r="10" fill="#06B6D4" stroke="#0F172A" stroke-width="3"/>
  <line x1="600" y1="145" x2="600" y2="220" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Legend -->
  <rect x="880" y="250" width="24" height="4" rx="2" fill="#EF4444" opacity="0.8"/>
  <line x1="882" y1="252" x2="902" y2="252" stroke="#EF4444" stroke-width="3" stroke-dasharray="8,4" opacity="0.8"/>
  <text x="912" y="257" font-size="14" fill="#94A3B8">FDE活用なし（失敗パターン）</text>

  <line x1="882" y1="285" x2="906" y2="285" stroke="#06B6D4" stroke-width="4"/>
  <text x="912" y="290" font-size="14" fill="#06B6D4">FDE活用あり（定着成功パターン）</text>

  <!-- FDE介入ラベル -->
  <rect x="614" y="155" width="200" height="52" rx="8" fill="#0C4A6E" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="714" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#38BDF8">FDE介入ポイント</text>
  <text x="714" y="198" text-anchor="middle" font-size="12" fill="#7DD3FC">ヒアリング→PoC→展開</text>

  <!-- 失敗パターン annotation -->
  <text x="780" y="395" text-anchor="middle" font-size="13" fill="#EF4444">「誰も使わない」状態へ</text>

  <!-- FDE活用annotation -->
  <text x="1050" y="128" text-anchor="middle" font-size="13" fill="#06B6D4" font-weight="700">定着・自走段階へ</text>
</svg>
