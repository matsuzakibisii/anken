<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP', sans-serif">
  <!-- Background -->
  <rect width="1200" height="480" fill="#0F172A" rx="16"/>

  <!-- Title -->
  <text x="600" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#F1F5F9">FDEを活用してAI定着を実現する3ステップ（スポット外注）</text>

  <!-- ===== STEP 1 ===== -->
  <rect x="60" y="80" width="320" height="340" rx="14" fill="#1E293B" stroke="#7C3AED" stroke-width="2.5"/>
  <!-- Step badge -->
  <circle cx="220" cy="80" r="22" fill="#7C3AED"/>
  <text x="220" y="87" text-anchor="middle" font-size="20" font-weight="900" fill="white">1</text>

  <text x="220" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#A78BFA">現場ヒアリング</text>
  <text x="220" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#A78BFA">AI活用課題の可視化</text>

  <!-- Icon area -->
  <g transform="translate(172, 168)">
    <!-- Magnifying glass icon -->
    <circle cx="40" cy="30" r="22" fill="none" stroke="#7C3AED" stroke-width="3"/>
    <line x1="56" y1="46" x2="74" y2="64" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Inner dots representing data -->
    <circle cx="33" cy="23" r="3" fill="#A78BFA"/>
    <circle cx="44" cy="33" r="3" fill="#A78BFA"/>
    <circle cx="36" cy="38" r="3" fill="#A78BFA"/>
  </g>

  <line x1="100" y1="248" x2="340" y2="248" stroke="#334155" stroke-width="1"/>

  <text x="220" y="276" text-anchor="middle" font-size="13" fill="#CBD5E1">誰が・どの業務で</text>
  <text x="220" y="296" text-anchor="middle" font-size="13" fill="#CBD5E1">AIが詰まっているかを可視化</text>
  <text x="220" y="316" text-anchor="middle" font-size="13" fill="#CBD5E1">ボトルネックマップ作成</text>

  <rect x="100" y="332" width="240" height="52" rx="10" fill="#4C1D95" opacity="0.6"/>
  <text x="220" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#C4B5FD">期間：1〜3日</text>
  <text x="220" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#C4B5FD">費用：5〜15万円</text>

  <!-- Arrow 1→2 -->
  <g transform="translate(395, 240)">
    <polygon points="0,0 36,20 0,40" fill="#06B6D4" opacity="0.8"/>
  </g>

  <!-- ===== STEP 2 ===== -->
  <rect x="440" y="80" width="320" height="340" rx="14" fill="#1E293B" stroke="#06B6D4" stroke-width="2.5"/>
  <!-- Step badge -->
  <circle cx="600" cy="80" r="22" fill="#06B6D4"/>
  <text x="600" y="87" text-anchor="middle" font-size="20" font-weight="900" fill="white">2</text>

  <text x="600" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#38BDF8">PoC実施・業務フロー</text>
  <text x="600" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#38BDF8">への組み込み</text>

  <!-- Icon area -->
  <g transform="translate(552, 168)">
    <!-- Workflow/puzzle icon -->
    <rect x="10" y="10" width="30" height="22" rx="4" fill="none" stroke="#06B6D4" stroke-width="2.5"/>
    <rect x="56" y="10" width="30" height="22" rx="4" fill="none" stroke="#06B6D4" stroke-width="2.5"/>
    <line x1="40" y1="21" x2="56" y2="21" stroke="#06B6D4" stroke-width="2.5"/>
    <rect x="32" y="40" width="32" height="22" rx="4" fill="#06B6D4" opacity="0.5"/>
    <line x1="48" y1="32" x2="48" y2="40" stroke="#06B6D4" stroke-width="2.5"/>
    <text x="48" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="white">AI</text>
  </g>

  <line x1="480" y1="248" x2="720" y2="248" stroke="#334155" stroke-width="1"/>

  <text x="600" y="276" text-anchor="middle" font-size="13" fill="#CBD5E1">定着効果の高い業務1つを選定</text>
  <text x="600" y="296" text-anchor="middle" font-size="13" fill="#CBD5E1">FDEがペアで現場実装・実演</text>
  <text x="600" y="316" text-anchor="middle" font-size="13" fill="#CBD5E1">「使う前提」の業務フロー完成</text>

  <rect x="480" y="332" width="240" height="52" rx="10" fill="#0C4A6E" opacity="0.6"/>
  <text x="600" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#7DD3FC">期間：2〜4週間</text>
  <text x="600" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#7DD3FC">費用：20〜50万円</text>

  <!-- Arrow 2→3 -->
  <g transform="translate(775, 240)">
    <polygon points="0,0 36,20 0,40" fill="#06B6D4" opacity="0.8"/>
  </g>

  <!-- ===== STEP 3 ===== -->
  <rect x="820" y="80" width="320" height="340" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2.5"/>
  <!-- Step badge -->
  <circle cx="980" cy="80" r="22" fill="#10B981"/>
  <text x="980" y="87" text-anchor="middle" font-size="20" font-weight="900" fill="white">3</text>

  <text x="980" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#34D399">全社展開・継続的</text>
  <text x="980" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#34D399">改善サポート</text>

  <!-- Icon area -->
  <g transform="translate(940, 168)">
    <!-- Network/spread icon -->
    <circle cx="40" cy="20" r="10" fill="#10B981" opacity="0.7"/>
    <text x="40" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="white">AI</text>
    <circle cx="10" cy="52" r="8" fill="#10B981" opacity="0.5"/>
    <circle cx="40" cy="60" r="8" fill="#10B981" opacity="0.5"/>
    <circle cx="70" cy="52" r="8" fill="#10B981" opacity="0.5"/>
    <line x1="32" y1="29" x2="16" y2="44" stroke="#10B981" stroke-width="2" opacity="0.7"/>
    <line x1="40" y1="30" x2="40" y2="52" stroke="#10B981" stroke-width="2" opacity="0.7"/>
    <line x1="48" y1="29" x2="64" y2="44" stroke="#10B981" stroke-width="2" opacity="0.7"/>
  </g>

  <line x1="860" y1="248" x2="1100" y2="248" stroke="#334155" stroke-width="1"/>

  <text x="980" y="276" text-anchor="middle" font-size="13" fill="#CBD5E1">PoCフローを他部署・拠点へ横展開</text>
  <text x="980" y="296" text-anchor="middle" font-size="13" fill="#CBD5E1">社内AI推進担当者を育成</text>
  <text x="980" y="316" text-anchor="middle" font-size="13" fill="#CBD5E1">月次スポット依頼で継続改善</text>

  <rect x="860" y="332" width="240" height="52" rx="10" fill="#064E3B" opacity="0.6"/>
  <text x="980" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#6EE7B7">月1〜3日・継続依頼</text>
  <text x="980" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#6EE7B7">月5〜15万円（スポット）</text>

  <!-- Bottom result banner -->
  <rect x="60" y="434" width="1080" height="34" rx="8" fill="#7C3AED" opacity="0.2" stroke="#7C3AED" stroke-width="1"/>
  <text x="600" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#C4B5FD">3ステップ合計目安：スモールスタートで30〜60万円・4〜6週間でAI定着の基盤が完成</text>
</svg>
