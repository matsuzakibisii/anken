<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="560" fill="#fafafa" rx="16"/>

  <!-- タイトル -->
  <text x="600" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">VBAマクロ移行先4選：自社DIY vs スポット外注依頼の比較</text>

  <!-- ヘッダー行 -->
  <rect x="40" y="72" width="220" height="48" fill="#0369A1" rx="6"/>
  <rect x="270" y="72" width="210" height="48" fill="#0369A1" rx="6"/>
  <rect x="490" y="72" width="210" height="48" fill="#0369A1" rx="6"/>
  <rect x="710" y="72" width="210" height="48" fill="#0369A1" rx="6"/>
  <rect x="930" y="72" width="230" height="48" fill="#DC2626" rx="6"/>

  <text x="150" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="white">移行先ツール</text>
  <text x="375" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="white">主な用途</text>
  <text x="595" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="white">自社DIY難易度</text>
  <text x="815" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="white">費用目安（外注）</text>
  <text x="1045" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="white">スポット外注</text>
  <text x="1045" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="white">との相性</text>

  <!-- 行1: Power Automate Desktop -->
  <rect x="40" y="130" width="220" height="80" fill="white" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>
  <rect x="270" y="130" width="210" height="80" fill="white" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>
  <rect x="490" y="130" width="210" height="80" fill="#FEF2F2" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>
  <rect x="710" y="130" width="210" height="80" fill="white" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>
  <rect x="930" y="130" width="230" height="80" fill="#DCFCE7" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>

  <text x="150" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#0369A1">Power Automate</text>
  <text x="150" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#0369A1">Desktop（PAD）</text>
  <text x="375" y="160" text-anchor="middle" font-size="13" fill="#374151">定型業務の</text>
  <text x="375" y="178" text-anchor="middle" font-size="13" fill="#374151">クリック・転記自動化</text>
  <text x="595" y="157" text-anchor="middle" font-size="13" fill="#DC2626">★★★☆☆</text>
  <text x="595" y="176" text-anchor="middle" font-size="12" fill="#6b7280">ノーコードだが</text>
  <text x="595" y="193" text-anchor="middle" font-size="12" fill="#6b7280">設計が複雑</text>
  <text x="815" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">10〜25万円</text>
  <text x="815" y="183" text-anchor="middle" font-size="12" fill="#6b7280">3〜5週間</text>
  <text x="1045" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">◎ 最高</text>
  <text x="1045" y="185" text-anchor="middle" font-size="12" fill="#374151">M365環境で即対応可</text>

  <!-- 行2: Python -->
  <rect x="40" y="220" width="220" height="80" fill="white" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>
  <rect x="270" y="220" width="210" height="80" fill="white" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>
  <rect x="490" y="220" width="210" height="80" fill="#FEF2F2" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>
  <rect x="710" y="220" width="210" height="80" fill="white" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>
  <rect x="930" y="220" width="230" height="80" fill="#DCFCE7" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>

  <text x="150" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#0369A1">Pythonスクリプト</text>
  <text x="375" y="250" text-anchor="middle" font-size="13" fill="#374151">データ加工・集計・</text>
  <text x="375" y="268" text-anchor="middle" font-size="13" fill="#374151">ファイル変換・バッチ</text>
  <text x="595" y="247" text-anchor="middle" font-size="13" fill="#DC2626">★★★★★</text>
  <text x="595" y="266" text-anchor="middle" font-size="12" fill="#6b7280">プログラミング</text>
  <text x="595" y="283" text-anchor="middle" font-size="12" fill="#6b7280">スキル必須</text>
  <text x="815" y="253" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">10〜30万円</text>
  <text x="815" y="273" text-anchor="middle" font-size="12" fill="#6b7280">3〜6週間</text>
  <text x="1045" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">◎ 最高</text>
  <text x="1045" y="275" text-anchor="middle" font-size="12" fill="#374151">汎用性が高く依頼しやすい</text>

  <!-- 行3: kintone/Notion -->
  <rect x="40" y="310" width="220" height="80" fill="white" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>
  <rect x="270" y="310" width="210" height="80" fill="white" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>
  <rect x="490" y="310" width="210" height="80" fill="#FFF7ED" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>
  <rect x="710" y="310" width="210" height="80" fill="white" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>
  <rect x="930" y="310" width="230" height="80" fill="#DCFCE7" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>

  <text x="150" y="343" text-anchor="middle" font-size="14" font-weight="700" fill="#0369A1">kintone・Notion</text>
  <text x="150" y="362" text-anchor="middle" font-size="13" fill="#374151">等ノーコードDB</text>
  <text x="375" y="340" text-anchor="middle" font-size="13" fill="#374151">データ管理・承認</text>
  <text x="375" y="358" text-anchor="middle" font-size="13" fill="#374151">フロー・情報共有</text>
  <text x="595" y="337" text-anchor="middle" font-size="13" fill="#D97706">★★★☆☆</text>
  <text x="595" y="356" text-anchor="middle" font-size="12" fill="#6b7280">SaaS知識があれば</text>
  <text x="595" y="373" text-anchor="middle" font-size="12" fill="#6b7280">導入可能</text>
  <text x="815" y="343" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">15〜35万円</text>
  <text x="815" y="363" text-anchor="middle" font-size="12" fill="#6b7280">4〜7週間</text>
  <text x="1045" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">○ 高い</text>
  <text x="1045" y="365" text-anchor="middle" font-size="12" fill="#374151">カスタマイズ依頼が容易</text>

  <!-- 行4: Webアプリ開発 -->
  <rect x="40" y="400" width="220" height="80" fill="white" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>
  <rect x="270" y="400" width="210" height="80" fill="white" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>
  <rect x="490" y="400" width="210" height="80" fill="#FEF2F2" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>
  <rect x="710" y="400" width="210" height="80" fill="white" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>
  <rect x="930" y="400" width="230" height="80" fill="#DCFCE7" stroke="#e5e7eb" stroke-width="1.5" rx="4"/>

  <text x="150" y="433" text-anchor="middle" font-size="14" font-weight="700" fill="#0369A1">Webアプリ</text>
  <text x="150" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#0369A1">社内ツール開発</text>
  <text x="375" y="430" text-anchor="middle" font-size="13" fill="#374151">複数人同時利用・</text>
  <text x="375" y="448" text-anchor="middle" font-size="13" fill="#374151">承認フロー・外部連携</text>
  <text x="595" y="427" text-anchor="middle" font-size="13" fill="#DC2626">★★★★★</text>
  <text x="595" y="446" text-anchor="middle" font-size="12" fill="#6b7280">エンジニアなしでは</text>
  <text x="595" y="463" text-anchor="middle" font-size="12" fill="#6b7280">ほぼ不可能</text>
  <text x="815" y="433" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">30〜150万円</text>
  <text x="815" y="453" text-anchor="middle" font-size="12" fill="#6b7280">1〜4ヶ月</text>
  <text x="1045" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">◎ 最高</text>
  <text x="1045" y="455" text-anchor="middle" font-size="12" fill="#374151">スポット外注が最適解</text>

  <!-- 凡例 -->
  <text x="40" y="520" font-size="13" fill="#6b7280">★の数＝DIY難易度（多いほど難しい）　　赤背景＝専門知識必須　　オレンジ背景＝中程度　　緑ハイライト＝スポット外注相性 ◎</text>
</svg>
