<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP', sans-serif">
  <!-- Background -->
  <rect width="1200" height="500" fill="#FAFAF7" rx="16"/>
  
  <!-- Title -->
  <text x="600" y="44" font-size="22" font-weight="900" fill="#312E81" text-anchor="middle">FDE副業の月収推移比較｜単発終了 vs 継続受注</text>
  
  <!-- Grid lines -->
  <line x1="140" y1="80" x2="1060" y2="80" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="140" y1="160" x2="1060" y2="160" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="140" y1="240" x2="1060" y2="240" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="140" y1="320" x2="1060" y2="320" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="140" y1="400" x2="1060" y2="400" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Y-axis labels -->
  <text x="120" y="85" font-size="13" fill="#6B7280" text-anchor="end">20万円</text>
  <text x="120" y="165" font-size="13" fill="#6B7280" text-anchor="end">15万円</text>
  <text x="120" y="245" font-size="13" fill="#6B7280" text-anchor="end">10万円</text>
  <text x="120" y="325" font-size="13" fill="#6B7280" text-anchor="end">5万円</text>
  <text x="120" y="405" font-size="13" fill="#6B7280" text-anchor="end">0</text>

  <!-- X-axis labels -->
  <text x="220" y="430" font-size="14" fill="#374151" text-anchor="middle">1ヶ月目</text>
  <text x="420" y="430" font-size="14" fill="#374151" text-anchor="middle">2ヶ月目</text>
  <text x="620" y="430" font-size="14" fill="#374151" text-anchor="middle">3ヶ月目</text>
  <text x="820" y="430" font-size="14" fill="#374151" text-anchor="middle">6ヶ月目</text>
  <text x="1020" y="430" font-size="14" fill="#374151" text-anchor="middle">12ヶ月目</text>

  <!-- X-axis line -->
  <line x1="140" y1="400" x2="1060" y2="400" stroke="#9CA3AF" stroke-width="1.5"/>
  <!-- Y-axis line -->
  <line x1="140" y1="80" x2="140" y2="400" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- Shaded area: 継続受注パターン -->
  <polygon points="220,368 420,320 620,240 820,144 1020,80 1060,80 1060,400 140,400 220,400" fill="#EAB308" opacity="0.12"/>
  
  <!-- Shaded area: 単発終了パターン -->
  <polygon points="220,368 420,368 620,360 820,352 1020,348 1060,348 1060,400 140,400 220,400" fill="#6B7280" opacity="0.10"/>

  <!-- Line: 単発終了パターン (gray) -->
  <polyline points="220,368 420,368 620,360 820,352 1020,348"
    fill="none" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="8,5"/>
  <!-- Dots: 単発終了 -->
  <circle cx="220" cy="368" r="6" fill="#9CA3AF"/>
  <circle cx="420" cy="368" r="6" fill="#9CA3AF"/>
  <circle cx="620" cy="360" r="6" fill="#9CA3AF"/>
  <circle cx="820" cy="352" r="6" fill="#9CA3AF"/>
  <circle cx="1020" cy="348" r="6" fill="#9CA3AF"/>

  <!-- Value labels: 単発終了 -->
  <text x="220" y="388" font-size="12" fill="#9CA3AF" text-anchor="middle">2〜3万</text>
  <text x="420" y="388" font-size="12" fill="#9CA3AF" text-anchor="middle">2〜3万</text>
  <text x="620" y="378" font-size="12" fill="#9CA3AF" text-anchor="middle">3万</text>
  <text x="820" y="368" font-size="12" fill="#9CA3AF" text-anchor="middle">3〜4万</text>
  <text x="1020" y="364" font-size="12" fill="#9CA3AF" text-anchor="middle">4万前後</text>

  <!-- Line: 継続受注パターン (yellow/indigo) -->
  <polyline points="220,368 420,320 620,240 820,144 1020,80"
    fill="none" stroke="#EAB308" stroke-width="4"/>
  <!-- Dots: 継続受注 -->
  <circle cx="220" cy="368" r="8" fill="#312E81" stroke="#EAB308" stroke-width="3"/>
  <circle cx="420" cy="320" r="8" fill="#312E81" stroke="#EAB308" stroke-width="3"/>
  <circle cx="620" cy="240" r="8" fill="#312E81" stroke="#EAB308" stroke-width="3"/>
  <circle cx="820" cy="144" r="8" fill="#312E81" stroke="#EAB308" stroke-width="3"/>
  <circle cx="1020" cy="80" r="8" fill="#312E81" stroke="#EAB308" stroke-width="3"/>

  <!-- Value labels: 継続受注 -->
  <text x="220" y="350" font-size="13" font-weight="700" fill="#312E81" text-anchor="middle">2〜5万</text>
  <text x="420" y="302" font-size="13" font-weight="700" fill="#312E81" text-anchor="middle">5〜10万</text>
  <text x="620" y="222" font-size="13" font-weight="700" fill="#312E81" text-anchor="middle">10〜15万</text>
  <text x="820" y="126" font-size="13" font-weight="700" fill="#312E81" text-anchor="middle">15〜18万</text>
  <text x="1020" y="62" font-size="13" font-weight="700" fill="#312E81" text-anchor="middle">20万超</text>

  <!-- Legend -->
  <rect x="160" y="455" width="220" height="32" rx="8" fill="#F3F4F6"/>
  <line x1="178" y1="471" x2="220" y2="471" stroke="#EAB308" stroke-width="3"/>
  <circle cx="199" cy="471" r="6" fill="#312E81" stroke="#EAB308" stroke-width="2.5"/>
  <text x="230" y="475" font-size="13" fill="#312E81" font-weight="700">継続受注パターン</text>

  <rect x="420" y="455" width="220" height="32" rx="8" fill="#F3F4F6"/>
  <line x1="438" y1="471" x2="480" y2="471" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="459" cy="471" r="6" fill="#9CA3AF"/>
  <text x="490" y="475" font-size="13" fill="#6B7280" font-weight="700">単発終了パターン</text>

  <!-- Annotation arrow -->
  <path d="M 800 180 Q 870 150 900 110" fill="none" stroke="#EAB308" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#EAB308"/>
    </marker>
  </defs>
  <rect x="680" y="182" width="200" height="40" rx="8" fill="#312E81" opacity="0.9"/>
  <text x="780" y="198" font-size="12" fill="#EAB308" text-anchor="middle" font-weight="700">3件の実績で</text>
  <text x="780" y="214" font-size="12" fill="#white" fill="white" text-anchor="middle">安定受注が始まる</text>
</svg>
