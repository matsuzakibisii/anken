<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FDE副業ポートフォリオの3構成要素">
  <defs>
    <style>
      text { font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="500" fill="#FAFAFA" rx="16"/>

  <!-- タイトル -->
  <text x="600" y="56" text-anchor="middle" font-size="26" font-weight="900" fill="#1F1B3A">FDE副業ポートフォリオを構成する3つの要素</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#6B7280">発注者が「このエンジニアに頼めそう」と判断するための3要素を一元化する</text>

  <!-- カード共通シャドウ -->
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C3AED" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ─── カード1: 業界知識 ─── -->
  <rect x="60" y="118" width="330" height="340" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
  <!-- アクセントバー -->
  <rect x="60" y="118" width="330" height="8" rx="8" fill="#7C3AED"/>
  <rect x="60" y="122" width="330" height="4" fill="#7C3AED"/>

  <!-- アイコン背景 -->
  <circle cx="225" cy="196" r="36" fill="#EDE9FE"/>
  <!-- 建物アイコン（シンプルなフラット） -->
  <rect x="204" y="182" width="42" height="32" rx="3" fill="none" stroke="#7C3AED" stroke-width="3"/>
  <rect x="213" y="191" width="10" height="10" rx="1" fill="#7C3AED" opacity="0.6"/>
  <rect x="227" y="191" width="10" height="10" rx="1" fill="#7C3AED" opacity="0.6"/>
  <rect x="220" y="202" width="10" height="12" rx="1" fill="#7C3AED"/>
  <line x1="225" y1="182" x2="225" y2="176" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="215" y1="176" x2="235" y2="176" stroke="#7C3AED" stroke-width="2.5"/>

  <text x="225" y="258" text-anchor="middle" font-size="20" font-weight="900" fill="#4C1D95">業界知識</text>
  <text x="225" y="280" text-anchor="middle" font-size="13" fill="#7C3AED">Industry Knowledge</text>

  <!-- 区切り線 -->
  <line x1="90" y1="296" x2="360" y2="296" stroke="#EDE9FE" stroke-width="1.5"/>

  <!-- リスト項目 -->
  <circle cx="98" cy="322" r="5" fill="#7C3AED"/>
  <text x="112" y="327" font-size="14" fill="#374151">製造業・建設業の現場課題</text>
  <circle cx="98" cy="352" r="5" fill="#7C3AED" opacity="0.6"/>
  <text x="112" y="357" font-size="14" fill="#374151">医療・介護・士業の業務フロー</text>
  <circle cx="98" cy="382" r="5" fill="#7C3AED" opacity="0.6"/>
  <text x="112" y="387" font-size="14" fill="#374151">EC・小売・流通の在庫・受発注</text>
  <circle cx="98" cy="412" r="5" fill="#7C3AED" opacity="0.4"/>
  <text x="112" y="417" font-size="14" fill="#374151">SES・人材・教育系の管理業務</text>

  <!-- タグ -->
  <rect x="136" y="434" width="178" height="10" rx="5" fill="#EDE9FE"/>
  <rect x="136" y="434" width="120" height="10" rx="5" fill="#7C3AED" opacity="0.5"/>

  <!-- ─── カード2: 実装力（中央） ─── -->
  <rect x="435" y="118" width="330" height="340" rx="16" fill="#1F1B3A" filter="url(#shadow)"/>
  <!-- アクセントバー（アンバー） -->
  <rect x="435" y="118" width="330" height="8" rx="8" fill="#D97706"/>
  <rect x="435" y="122" width="330" height="4" fill="#D97706"/>

  <!-- 「中心」ラベル -->
  <rect x="553" y="113" width="94" height="22" rx="11" fill="#D97706"/>
  <text x="600" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">最も重要</text>

  <!-- アイコン背景 -->
  <circle cx="600" cy="196" r="36" fill="#312E81"/>
  <!-- ギアアイコン -->
  <circle cx="600" cy="196" r="12" fill="none" stroke="#D97706" stroke-width="3"/>
  <circle cx="600" cy="196" r="5" fill="#D97706"/>
  <rect x="597" y="180" width="6" height="8" rx="2" fill="#D97706"/>
  <rect x="597" y="204" width="6" height="8" rx="2" fill="#D97706"/>
  <rect x="584" y="193" width="8" height="6" rx="2" fill="#D97706"/>
  <rect x="608" y="193" width="8" height="6" rx="2" fill="#D97706"/>

  <text x="600" y="258" text-anchor="middle" font-size="20" font-weight="900" fill="#FFF">実装力</text>
  <text x="600" y="280" text-anchor="middle" font-size="13" fill="#D97706">Technical Stack</text>

  <!-- 区切り線 -->
  <line x1="465" y1="296" x2="735" y2="296" stroke="#312E81" stroke-width="1.5"/>

  <!-- リスト項目 -->
  <circle cx="473" cy="322" r="5" fill="#D97706"/>
  <text x="487" y="327" font-size="14" fill="#E5E7EB">LLM API連携（OpenAI / Anthropic）</text>
  <circle cx="473" cy="352" r="5" fill="#D97706" opacity="0.8"/>
  <text x="487" y="357" font-size="14" fill="#E5E7EB">RAGシステム設計・構築</text>
  <circle cx="473" cy="382" r="5" fill="#D97706" opacity="0.6"/>
  <text x="487" y="387" font-size="14" fill="#E5E7EB">業務自動化（Python / GAS / RPA）</text>
  <circle cx="473" cy="412" r="5" fill="#D97706" opacity="0.4"/>
  <text x="487" y="417" font-size="14" fill="#E5E7EB">プロンプト設計・評価・最適化</text>

  <!-- タグバー -->
  <rect x="510" y="434" width="180" height="10" rx="5" fill="#312E81"/>
  <rect x="510" y="434" width="130" height="10" rx="5" fill="#D97706" opacity="0.7"/>

  <!-- ─── カード3: 対話力 ─── -->
  <rect x="810" y="118" width="330" height="340" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
  <!-- アクセントバー（バイオレット薄め） -->
  <rect x="810" y="118" width="330" height="8" rx="8" fill="#A78BFA"/>
  <rect x="810" y="122" width="330" height="4" fill="#A78BFA"/>

  <!-- アイコン背景 -->
  <circle cx="975" cy="196" r="36" fill="#F5F3FF"/>
  <!-- チャットバブルアイコン -->
  <rect x="956" y="181" width="32" height="22" rx="5" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
  <circle cx="966" cy="192" r="2.5" fill="#7C3AED"/>
  <circle cx="975" cy="192" r="2.5" fill="#7C3AED"/>
  <circle cx="984" cy="192" r="2.5" fill="#7C3AED"/>
  <path d="M963 203 L960 211 L970 205" fill="#7C3AED" opacity="0.7"/>

  <text x="975" y="258" text-anchor="middle" font-size="20" font-weight="900" fill="#4C1D95">対話力</text>
  <text x="975" y="280" text-anchor="middle" font-size="13" fill="#7C3AED">Communication</text>

  <!-- 区切り線 -->
  <line x1="840" y1="296" x2="1110" y2="296" stroke="#EDE9FE" stroke-width="1.5"/>

  <!-- リスト項目 -->
  <circle cx="848" cy="322" r="5" fill="#A78BFA"/>
  <text x="862" y="327" font-size="14" fill="#374151">非技術者への要件ヒアリング</text>
  <circle cx="848" cy="352" r="5" fill="#A78BFA" opacity="0.7"/>
  <text x="862" y="357" font-size="14" fill="#374151">AI研修・ハンズオン講師経験</text>
  <circle cx="848" cy="382" r="5" fill="#A78BFA" opacity="0.5"/>
  <text x="862" y="387" font-size="14" fill="#374151">進捗・成果物の文書化・説明</text>
  <circle cx="848" cy="412" r="5" fill="#A78BFA" opacity="0.3"/>
  <text x="862" y="417" font-size="14" fill="#374151">現場への定着支援・改善提案</text>

  <!-- タグバー -->
  <rect x="886" y="434" width="178" height="10" rx="5" fill="#EDE9FE"/>
  <rect x="886" y="434" width="90" height="10" rx="5" fill="#A78BFA" opacity="0.6"/>

  <!-- 3カードをつなぐ矢印 -->
  <path d="M393 288 L432 288" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrowAmber)" opacity="0.7"/>
  <path d="M768 288 L807 288" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrowAmber)" opacity="0.7"/>
  <defs>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- 下部の注釈 -->
  <text x="600" y="482" text-anchor="middle" font-size="13" fill="#9CA3AF">3要素をNotionページ・GitHub・Google DocsなどでURLとして共有できる形にまとめる</text>
</svg>
