<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" style="font-family:'Noto Sans JP',sans-serif;">
  <!-- Background -->
  <rect width="1200" height="500" fill="#FAFAF7"/>

  <!-- Title -->
  <text x="600" y="44" text-anchor="middle" font-size="22" font-weight="900" fill="#1E1B4B">従来の技術伝承 vs AIチャット化の特性比較</text>

  <!-- Column headers -->
  <!-- Left: Traditional -->
  <rect x="60" y="70" width="500" height="48" rx="8" fill="#475569"/>
  <text x="310" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">従来の技術伝承（紙マニュアル・OJT・動画）</text>

  <!-- Right: AI Chat -->
  <rect x="640" y="70" width="500" height="48" rx="8" fill="#3730A3"/>
  <text x="890" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">AIチャット化ノウハウシステム</text>

  <!-- Row 1: 検索性 -->
  <rect x="60" y="132" width="500" height="72" rx="6" fill="#F1F5F9"/>
  <text x="310" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">🔍 検索性</text>
  <text x="310" y="180" text-anchor="middle" font-size="13" fill="#374151">目次で探す・人に聞く必要がある</text>
  <text x="310" y="197" text-anchor="middle" font-size="12" fill="#6B7280">「どこに書いてあるか」がわからないと使えない</text>

  <rect x="640" y="132" width="500" height="72" rx="6" fill="#EEF2FF"/>
  <text x="890" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#3730A3">🔍 検索性</text>
  <text x="890" y="180" text-anchor="middle" font-size="13" fill="#1E1B4B">自然言語で質問するだけで即回答</text>
  <text x="890" y="197" text-anchor="middle" font-size="12" fill="#4338CA">「〇〇が詰まったとき」のような現場用語で検索できる</text>

  <!-- Row 2: 対応時間 -->
  <rect x="60" y="218" width="500" height="72" rx="6" fill="#F1F5F9"/>
  <text x="310" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">⏰ 対応時間</text>
  <text x="310" y="266" text-anchor="middle" font-size="13" fill="#374151">担当者・シニア社員がいるときだけ</text>
  <text x="310" y="283" text-anchor="middle" font-size="12" fill="#6B7280">夜間・週末・担当者不在時は対応不可</text>

  <rect x="640" y="218" width="500" height="72" rx="6" fill="#EEF2FF"/>
  <text x="890" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#3730A3">⏰ 対応時間</text>
  <text x="890" y="266" text-anchor="middle" font-size="13" fill="#1E1B4B">24時間365日いつでも回答</text>
  <text x="890" y="283" text-anchor="middle" font-size="12" fill="#4338CA">夜間作業・連休中も現場で使える</text>

  <!-- Row 3: 更新コスト -->
  <rect x="60" y="304" width="500" height="72" rx="6" fill="#F1F5F9"/>
  <text x="310" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">🔄 更新コスト</text>
  <text x="310" y="352" text-anchor="middle" font-size="13" fill="#374151">マニュアル改訂・印刷・配布で高コスト</text>
  <text x="310" y="369" text-anchor="middle" font-size="12" fill="#6B7280">工程変更のたびに全部刷り直しが必要</text>

  <rect x="640" y="304" width="500" height="72" rx="6" fill="#EEF2FF"/>
  <text x="890" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#3730A3">🔄 更新コスト</text>
  <text x="890" y="352" text-anchor="middle" font-size="13" fill="#1E1B4B">データ追記だけで即反映・月3〜10万円で運用</text>
  <text x="890" y="369" text-anchor="middle" font-size="12" fill="#4338CA">工程変更時は該当部分のみ追記すればよい</text>

  <!-- Row 4: スタートコスト -->
  <rect x="60" y="390" width="500" height="72" rx="6" fill="#FFF7ED"/>
  <text x="310" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#D97706">💰 初期構築コスト</text>
  <text x="310" y="438" text-anchor="middle" font-size="13" fill="#374151">低〜中（印刷・制作費のみ）</text>
  <text x="310" y="455" text-anchor="middle" font-size="12" fill="#6B7280">ただし「作っても使われない」リスクが高い</text>

  <rect x="640" y="390" width="500" height="72" rx="6" fill="#FFF7ED"/>
  <text x="890" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#D97706">💰 初期構築コスト</text>
  <text x="890" y="438" text-anchor="middle" font-size="13" fill="#1E1B4B">中（スポット外注：30〜100万円）</text>
  <text x="890" y="455" text-anchor="middle" font-size="12" fill="#4338CA">現場で実際に使われ続ける投資対効果あり</text>

  <!-- VS divider -->
  <circle cx="600" cy="295" r="26" fill="#D97706"/>
  <text x="600" y="302" text-anchor="middle" font-size="16" font-weight="900" fill="#FFFFFF">VS</text>
</svg>
