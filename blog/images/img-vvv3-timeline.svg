<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <style>
    text { font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; }
    .title { font-size: 22px; font-weight: 900; fill: #14532D; }
    .step-num { font-size: 32px; font-weight: 900; fill: #fff; }
    .step-title { font-size: 16px; font-weight: 900; fill: #14532D; }
    .step-period { font-size: 13px; font-weight: 700; fill: #16A34A; }
    .step-desc { font-size: 12px; fill: #374151; }
    .step-sub { font-size: 11px; fill: #6B7280; }
    .milestone { font-size: 11px; font-weight: 700; fill: #BE123C; }
  </style>

  <!-- 背景 -->
  <rect width="1200" height="420" fill="#F0FDF4" rx="16"/>

  <!-- タイトル -->
  <text x="60" y="52" class="title">VBAマクロ廃止対応：スポット外注を使った3ヶ月タイムライン</text>

  <!-- 横タイムラインバー -->
  <rect x="80" y="110" width="1040" height="6" rx="3" fill="#BBF7D0"/>

  <!-- 月ラベル -->
  <text x="80" y="100" font-family="'Noto Sans JP',sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Month 1</text>
  <text x="427" y="100" font-family="'Noto Sans JP',sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Month 2</text>
  <text x="773" y="100" font-family="'Noto Sans JP',sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Month 3</text>
  <text x="1120" y="100" font-family="'Noto Sans JP',sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">完了</text>

  <!-- 区切り縦線（薄い） -->
  <line x1="427" y1="88" x2="427" y2="118" stroke="#D1FAE5" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="773" y1="88" x2="773" y2="118" stroke="#D1FAE5" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- STEP 1 -->
  <circle cx="220" cy="113" r="26" fill="#16A34A"/>
  <text x="220" y="123" class="step-num" text-anchor="middle">1</text>
  <line x1="220" y1="139" x2="220" y2="170" stroke="#16A34A" stroke-width="2" stroke-dasharray="4,3"/>

  <rect x="80" y="170" width="285" height="210" rx="10" fill="#fff" stroke="#BBF7D0" stroke-width="2"/>
  <text x="220" y="198" class="step-title" text-anchor="middle">棚卸し・移行先選定</text>
  <text x="220" y="216" class="step-period" text-anchor="middle">所要期間：2〜3週間</text>
  <rect x="100" y="226" width="245" height="1" fill="#D1FAE5"/>
  <text x="222" y="247" class="step-desc" text-anchor="middle">▸ 既存VBAマクロの一覧化</text>
  <text x="222" y="266" class="step-desc" text-anchor="middle">▸ 業務影響度・優先順位の整理</text>
  <text x="222" y="285" class="step-desc" text-anchor="middle">▸ 移行先ツールの比較・選定</text>
  <text x="222" y="304" class="step-desc" text-anchor="middle">▸ スポット外注先の選定・契約</text>
  <rect x="100" y="320" width="245" height="1" fill="#D1FAE5"/>
  <text x="222" y="340" class="milestone" text-anchor="middle">🏁 移行ロードマップ確定</text>
  <text x="222" y="358" class="step-sub" text-anchor="middle">外注費目安：5〜15万円</text>

  <!-- STEP 2 -->
  <circle cx="600" cy="113" r="26" fill="#F87171"/>
  <text x="600" y="123" class="step-num" text-anchor="middle" fill="#fff">2</text>
  <line x1="600" y1="139" x2="600" y2="170" stroke="#F87171" stroke-width="2" stroke-dasharray="4,3"/>

  <rect x="455" y="170" width="290" height="210" rx="10" fill="#fff" stroke="#FECACA" stroke-width="2"/>
  <text x="600" y="198" font-family="'Noto Sans JP',sans-serif" font-size="16" font-weight="900" fill="#991B1B" text-anchor="middle">移行開発・テスト</text>
  <text x="600" y="216" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="700" fill="#EF4444" text-anchor="middle">所要期間：3〜6週間</text>
  <rect x="475" y="226" width="250" height="1" fill="#FECACA"/>
  <text x="600" y="247" class="step-desc" text-anchor="middle">▸ スポット外注で新ツールに移行</text>
  <text x="600" y="266" class="step-desc" text-anchor="middle">▸ 動作テスト・検収確認</text>
  <text x="600" y="285" class="step-desc" text-anchor="middle">▸ 既存業務と並行稼働で安全確認</text>
  <text x="600" y="304" class="step-desc" text-anchor="middle">▸ バグ修正・微調整（スポット追加）</text>
  <rect x="475" y="320" width="250" height="1" fill="#FECACA"/>
  <text x="600" y="340" font-family="'Noto Sans JP',sans-serif" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">🏁 新ツール本番稼働開始</text>
  <text x="600" y="358" class="step-sub" text-anchor="middle">外注費目安：10〜50万円</text>

  <!-- STEP 3 -->
  <circle cx="960" cy="113" r="26" fill="#16A34A"/>
  <text x="960" y="123" class="step-num" text-anchor="middle">3</text>
  <line x1="960" y1="139" x2="960" y2="170" stroke="#16A34A" stroke-width="2" stroke-dasharray="4,3"/>

  <rect x="820" y="170" width="290" height="210" rx="10" fill="#fff" stroke="#BBF7D0" stroke-width="2"/>
  <text x="965" y="198" class="step-title" text-anchor="middle">引き継ぎ・運用整備</text>
  <text x="965" y="216" class="step-period" text-anchor="middle">所要期間：1〜2週間</text>
  <rect x="840" y="226" width="250" height="1" fill="#D1FAE5"/>
  <text x="965" y="247" class="step-desc" text-anchor="middle">▸ 操作マニュアル・手順書の整備</text>
  <text x="965" y="266" class="step-desc" text-anchor="middle">▸ 社内担当者への使い方レクチャー</text>
  <text x="965" y="285" class="step-desc" text-anchor="middle">▸ 旧VBAファイルのアーカイブ</text>
  <text x="965" y="304" class="step-desc" text-anchor="middle">▸ 保守・改修窓口の確保</text>
  <rect x="840" y="320" width="250" height="1" fill="#D1FAE5"/>
  <text x="965" y="340" class="milestone" text-anchor="middle">🏁 VBA廃止対応 完全完了</text>
  <text x="965" y="358" class="step-sub" text-anchor="middle">外注費目安：3〜8万円</text>

  <!-- ゴールフラグ -->
  <circle cx="1120" cy="113" r="12" fill="#14532D"/>
  <text x="1120" y="118" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#fff">✓</text>

  <!-- フッター -->
  <text x="60" y="400" font-family="'Noto Sans JP',sans-serif" font-size="11" fill="#9CA3AF">※ 期間・費用はマクロの本数・複雑さにより異なります。スポット外注であれば案件ごとに柔軟に依頼範囲を調整できます。</text>
</svg>
