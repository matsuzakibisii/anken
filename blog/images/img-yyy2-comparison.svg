<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" width="1200" height="500">
  <defs>
    <style>
      text { font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#F8FAFC" rx="0"/>

  <!-- Title -->
  <text x="600" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#1E293B">AIエージェント導入前後のITヘルプデスク比較</text>

  <!-- ===== BEFORE panel ===== -->
  <rect x="40" y="68" width="510" height="412" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <!-- header bar -->
  <rect x="40" y="68" width="510" height="54" rx="14" fill="#EA580C"/>
  <rect x="40" y="108" width="510" height="14" fill="#EA580C"/>
  <text x="295" y="102" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">従来のITヘルプデスク対応</text>

  <!-- Row 1 -->
  <rect x="64" y="142" width="462" height="76" rx="10" fill="#ffffff" stroke="#FDBA74" stroke-width="1.5"/>
  <rect x="64" y="142" width="6" height="76" rx="3" fill="#EA580C"/>
  <text x="86" y="168" font-size="12" fill="#9A3412" font-weight="700">対応時間</text>
  <text x="86" y="196" font-size="20" font-weight="900" fill="#EA580C">30分〜数日</text>

  <!-- Row 2 -->
  <rect x="64" y="232" width="462" height="76" rx="10" fill="#ffffff" stroke="#FDBA74" stroke-width="1.5"/>
  <rect x="64" y="232" width="6" height="76" rx="3" fill="#EA580C"/>
  <text x="86" y="258" font-size="12" fill="#9A3412" font-weight="700">夜間・休日対応</text>
  <text x="86" y="286" font-size="20" font-weight="900" fill="#EA580C">対応不可</text>
  <text x="260" y="286" font-size="13" fill="#6B7280">翌営業日以降に対応</text>

  <!-- Row 3 -->
  <rect x="64" y="322" width="462" height="76" rx="10" fill="#ffffff" stroke="#FDBA74" stroke-width="1.5"/>
  <rect x="64" y="322" width="6" height="76" rx="3" fill="#EA580C"/>
  <text x="86" y="348" font-size="12" fill="#9A3412" font-weight="700">同時対応数</text>
  <text x="86" y="376" font-size="20" font-weight="900" fill="#EA580C">1〜2件のみ</text>
  <text x="278" y="376" font-size="13" fill="#6B7280">担当者の稼働に依存</text>

  <!-- Row 4 -->
  <rect x="64" y="412" width="462" height="52" rx="10" fill="#ffffff" stroke="#FDBA74" stroke-width="1.5"/>
  <rect x="64" y="412" width="6" height="52" rx="3" fill="#EA580C"/>
  <text x="86" y="432" font-size="12" fill="#9A3412" font-weight="700">個人情報・機密管理</text>
  <text x="86" y="452" font-size="16" font-weight="700" fill="#EA580C">手作業での管理・運用</text>

  <!-- ===== VS badge ===== -->
  <circle cx="600" cy="274" r="38" fill="#1E293B" opacity="0.92"/>
  <text x="600" y="281" text-anchor="middle" font-size="17" font-weight="900" fill="#ffffff">VS</text>

  <!-- ===== AFTER panel ===== -->
  <rect x="650" y="68" width="510" height="412" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <!-- header bar -->
  <rect x="650" y="68" width="510" height="54" rx="14" fill="#3B82F6"/>
  <rect x="650" y="108" width="510" height="14" fill="#3B82F6"/>
  <text x="905" y="102" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">AIエージェント（RAG対応）</text>

  <!-- Row 1 -->
  <rect x="674" y="142" width="462" height="76" rx="10" fill="#ffffff" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="674" y="142" width="6" height="76" rx="3" fill="#3B82F6"/>
  <text x="696" y="168" font-size="12" fill="#1D4ED8" font-weight="700">対応時間</text>
  <text x="696" y="196" font-size="20" font-weight="900" fill="#3B82F6">即時回答（24h 365日）</text>

  <!-- Row 2 -->
  <rect x="674" y="232" width="462" height="76" rx="10" fill="#ffffff" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="674" y="232" width="6" height="76" rx="3" fill="#3B82F6"/>
  <text x="696" y="258" font-size="12" fill="#1D4ED8" font-weight="700">夜間・休日対応</text>
  <text x="696" y="286" font-size="20" font-weight="900" fill="#3B82F6">自動回答＋エスカレーション</text>

  <!-- Row 3 -->
  <rect x="674" y="322" width="462" height="76" rx="10" fill="#ffffff" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="674" y="322" width="6" height="76" rx="3" fill="#3B82F6"/>
  <text x="696" y="348" font-size="12" fill="#1D4ED8" font-weight="700">同時対応数</text>
  <text x="696" y="376" font-size="20" font-weight="900" fill="#3B82F6">無制限（同時対応可）</text>

  <!-- Row 4 -->
  <rect x="674" y="412" width="462" height="52" rx="10" fill="#ffffff" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="674" y="412" width="6" height="52" rx="3" fill="#3B82F6"/>
  <text x="696" y="432" font-size="12" fill="#1D4ED8" font-weight="700">個人情報・機密管理</text>
  <text x="696" y="452" font-size="16" font-weight="700" fill="#3B82F6">自動マスキング＋根拠明示</text>
</svg>
