<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP', sans-serif">
  <!-- Background -->
  <rect width="1200" height="500" fill="#F8F8FC"/>

  <!-- Title -->
  <text x="600" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1E1B4B">AI研修の種類別 費用相場（2026年版・税別目安）</text>

  <!-- Subtitle -->
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#6B7280">受講者数・カスタマイズ度合いにより変動します。助成金適用前の価格帯です。</text>

  <!-- Grid lines -->
  <line x1="300" y1="95" x2="300" y2="440" stroke="#E0E0F0" stroke-width="1"/>
  <line x1="480" y1="95" x2="480" y2="440" stroke="#E0E0F0" stroke-width="1"/>
  <line x1="660" y1="95" x2="660" y2="440" stroke="#E0E0F0" stroke-width="1"/>
  <line x1="840" y1="95" x2="840" y2="440" stroke="#E0E0F0" stroke-width="1"/>
  <line x1="1020" y1="95" x2="1020" y2="440" stroke="#E0E0F0" stroke-width="1"/>

  <!-- X-axis labels -->
  <text x="300" y="458" text-anchor="middle" font-size="12" fill="#9CA3AF">〜10万円</text>
  <text x="480" y="458" text-anchor="middle" font-size="12" fill="#9CA3AF">〜20万円</text>
  <text x="660" y="458" text-anchor="middle" font-size="12" fill="#9CA3AF">〜30万円</text>
  <text x="840" y="458" text-anchor="middle" font-size="12" fill="#9CA3AF">〜50万円</text>
  <text x="1020" y="458" text-anchor="middle" font-size="12" fill="#9CA3AF">100万円超</text>

  <!-- Y-axis base line -->
  <line x1="300" y1="95" x2="300" y2="445" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="300" y1="445" x2="1060" y2="445" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- Row 1: eラーニング（サブスク） -->
  <text x="290" y="138" text-anchor="end" font-size="14" font-weight="700" fill="#1E1B4B">eラーニング</text>
  <text x="290" y="156" text-anchor="end" font-size="12" fill="#6B7280">（サブスクリプション）</text>
  <!-- Low cost bar - short -->
  <rect x="302" y="120" width="90" height="28" rx="4" fill="#4F46E5" opacity="0.85"/>
  <text x="400" y="139" font-size="13" font-weight="700" fill="#4F46E5">月3,000〜8,000円/人</text>

  <!-- Row 2: 動画パッケージ -->
  <text x="290" y="208" text-anchor="end" font-size="14" font-weight="700" fill="#1E1B4B">動画パッケージ</text>
  <text x="290" y="226" text-anchor="end" font-size="12" fill="#6B7280">（買い切り型）</text>
  <rect x="302" y="190" width="270" height="28" rx="4" fill="#4F46E5" opacity="0.7"/>
  <text x="580" y="209" font-size="13" font-weight="700" fill="#4F46E5">10〜30万円/社</text>

  <!-- Row 3: 公開セミナー -->
  <text x="290" y="278" text-anchor="end" font-size="14" font-weight="700" fill="#1E1B4B">公開セミナー</text>
  <text x="290" y="296" text-anchor="end" font-size="12" fill="#6B7280">（外部参加型）</text>
  <rect x="302" y="260" width="210" height="28" rx="4" fill="#F59E0B" opacity="0.85"/>
  <text x="520" y="279" font-size="13" font-weight="700" fill="#92400E">3〜8万円/人・回</text>

  <!-- Row 4: 社内集合研修 -->
  <text x="290" y="348" text-anchor="end" font-size="14" font-weight="700" fill="#1E1B4B">社内集合研修</text>
  <text x="290" y="366" text-anchor="end" font-size="12" fill="#6B7280">（講師派遣型）</text>
  <rect x="302" y="330" width="360" height="28" rx="4" fill="#4F46E5" opacity="0.9"/>
  <text x="670" y="349" font-size="13" font-weight="700" fill="#312E81">10〜30万円/日</text>

  <!-- Row 5: コンサルティング併設型 -->
  <text x="290" y="414" text-anchor="end" font-size="14" font-weight="700" fill="#1E1B4B">コンサル併設型</text>
  <text x="290" y="432" text-anchor="end" font-size="12" fill="#6B7280">（継続支援込み）</text>
  <rect x="302" y="397" width="570" height="28" rx="4" fill="#F59E0B"/>
  <!-- Gradient bar extension with arrow -->
  <polygon points="870,397 900,411 870,425" fill="#D97706"/>
  <text x="880" y="416" font-size="13" font-weight="700" fill="#92400E">30〜100万円超</text>

  <!-- Legend -->
  <rect x="960" y="100" width="14" height="14" rx="2" fill="#4F46E5"/>
  <text x="980" y="112" font-size="12" fill="#374151">受講料相場</text>
  <rect x="960" y="122" width="14" height="14" rx="2" fill="#F59E0B"/>
  <text x="980" y="134" font-size="12" fill="#374151">注目帯域</text>

  <!-- Footer note -->
  <text x="600" y="490" text-anchor="middle" font-size="12" fill="#9CA3AF">※ 人材開発支援助成金（中小企業）を適用すると、上記費用の最大75%を助成。</text>
</svg>
