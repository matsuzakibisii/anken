<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP', sans-serif">
  <!-- Background -->
  <rect width="1200" height="480" fill="#0F0A1E"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="#F3F0FF">FDEをスポット外注してPoC→本番実装まで進める3ステップ</text>

  <!-- Step connector line -->
  <line x1="295" y1="200" x2="365" y2="200" stroke="#D97706" stroke-width="3"/>
  <line x1="695" y1="200" x2="765" y2="200" stroke="#D97706" stroke-width="3"/>

  <!-- Arrows -->
  <polygon points="365,193 380,200 365,207" fill="#D97706"/>
  <polygon points="765,193 780,200 765,207" fill="#D97706"/>

  <!-- Step 1 Card -->
  <rect x="60" y="90" width="250" height="280" rx="16" fill="#1E1040" stroke="#5B21B6" stroke-width="2"/>
  <!-- Step number badge -->
  <circle cx="185" cy="90" r="24" fill="#5B21B6"/>
  <text x="185" y="98" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">1</text>
  <!-- Step icon -->
  <text x="185" y="155" text-anchor="middle" font-size="36">📋</text>
  <!-- Step title -->
  <text x="185" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#A78BFA">PoC成果の</text>
  <text x="185" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#A78BFA">棚卸しと</text>
  <text x="185" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#A78BFA">スコープ確定</text>
  <!-- Divider -->
  <line x1="85" y1="250" x2="285" y2="250" stroke="#3B2F6E" stroke-width="1"/>
  <!-- Duration badge -->
  <rect x="110" y="265" width="150" height="28" rx="14" fill="#2D1F5E"/>
  <text x="185" y="283" text-anchor="middle" font-size="13" fill="#C4B5FD" font-weight="700">⏱ 1〜2週間</text>
  <!-- Description -->
  <text x="185" y="316" text-anchor="middle" font-size="12" fill="#9CA3AF">PoC報告書を読み解き</text>
  <text x="185" y="334" text-anchor="middle" font-size="12" fill="#9CA3AF">追加要件を特定。</text>
  <text x="185" y="352" text-anchor="middle" font-size="12" fill="#9CA3AF">スモールスタートの</text>
  <text x="185" y="370" text-anchor="middle" font-size="12" fill="#9CA3AF">範囲を確定する。</text>

  <!-- Step 2 Card -->
  <rect x="460" y="90" width="280" height="280" rx="16" fill="#1A0E05" stroke="#D97706" stroke-width="2.5"/>
  <!-- Step number badge -->
  <circle cx="600" cy="90" r="24" fill="#D97706"/>
  <text x="600" y="98" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">2</text>
  <!-- Step icon -->
  <text x="600" y="155" text-anchor="middle" font-size="36">🚀</text>
  <!-- Step title -->
  <text x="600" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#D97706">FDEをスポット外注で</text>
  <text x="600" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#D97706">PoC後フェーズに</text>
  <text x="600" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#D97706">集中投入</text>
  <!-- Divider -->
  <line x1="485" y1="250" x2="715" y2="250" stroke="#6B3F12" stroke-width="1"/>
  <!-- Duration badge -->
  <rect x="510" y="265" width="180" height="28" rx="14" fill="#3B1A0A"/>
  <text x="600" y="283" text-anchor="middle" font-size="13" fill="#FCD34D" font-weight="700">⏱ 4〜8週間（主要フェーズ）</text>
  <!-- Description -->
  <text x="600" y="316" text-anchor="middle" font-size="12" fill="#9CA3AF">既存システム連携・</text>
  <text x="600" y="334" text-anchor="middle" font-size="12" fill="#9CA3AF">例外処理設計・UI整備・</text>
  <text x="600" y="352" text-anchor="middle" font-size="12" fill="#9CA3AF">本番テストまで</text>
  <text x="600" y="370" text-anchor="middle" font-size="12" fill="#9CA3AF">FDEが一貫して担当。</text>

  <!-- Step 3 Card -->
  <rect x="860" y="90" width="280" height="280" rx="16" fill="#1E1040" stroke="#5B21B6" stroke-width="2"/>
  <!-- Step number badge -->
  <circle cx="1000" cy="90" r="24" fill="#5B21B6"/>
  <text x="1000" y="98" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">3</text>
  <!-- Step icon -->
  <text x="1000" y="155" text-anchor="middle" font-size="36">🔄</text>
  <!-- Step title -->
  <text x="1000" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#A78BFA">現場フィードバック</text>
  <text x="1000" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#A78BFA">ループの構築と</text>
  <text x="1000" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#A78BFA">定着</text>
  <!-- Divider -->
  <line x1="885" y1="250" x2="1115" y2="250" stroke="#3B2F6E" stroke-width="1"/>
  <!-- Duration badge -->
  <rect x="900" y="265" width="200" height="28" rx="14" fill="#2D1F5E"/>
  <text x="1000" y="283" text-anchor="middle" font-size="13" fill="#C4B5FD" font-weight="700">⏱ 2〜4週間</text>
  <!-- Description -->
  <text x="1000" y="316" text-anchor="middle" font-size="12" fill="#9CA3AF">現場トレーニング・</text>
  <text x="1000" y="334" text-anchor="middle" font-size="12" fill="#9CA3AF">改善サイクル構築・</text>
  <text x="1000" y="352" text-anchor="middle" font-size="12" fill="#9CA3AF">KPI設定。</text>
  <text x="1000" y="370" text-anchor="middle" font-size="12" fill="#9CA3AF">社内自走を実現する。</text>

  <!-- Footer summary -->
  <rect x="260" y="400" width="680" height="50" rx="10" fill="#1A0E05" stroke="#D97706" stroke-width="1.5"/>
  <text x="600" y="422" text-anchor="middle" font-size="14" fill="#D97706" font-weight="700">💰 トータル費用目安：スモールスタート 30〜80万円 ／ 期間：6〜12週間</text>
  <text x="600" y="441" text-anchor="middle" font-size="12" fill="#9CA3AF">FDEをPoC後フェーズだけにスポット外注するため、無駄なコストが発生しない</text>
</svg>
