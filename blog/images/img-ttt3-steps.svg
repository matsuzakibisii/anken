<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" style="font-family:'Noto Sans JP',sans-serif;">
  <!-- 背景 -->
  <rect width="1200" height="480" fill="#F0F4FF" rx="16"/>

  <!-- タイトル -->
  <text x="600" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#1E40AF">FDE活用でPoC→本番化を実現する3ステップ</text>

  <!-- ステップ背景カード -->
  <rect x="40" y="80" width="330" height="340" fill="#FFFFFF" rx="16" stroke="#1E40AF" stroke-width="2.5"/>
  <rect x="436" y="80" width="330" height="340" fill="#FFFFFF" rx="16" stroke="#1E40AF" stroke-width="2.5"/>
  <rect x="832" y="80" width="330" height="340" fill="#FFFFFF" rx="16" stroke="#65A30D" stroke-width="3"/>

  <!-- ステップ番号バッジ -->
  <circle cx="205" cy="115" r="28" fill="#1E40AF"/>
  <text x="205" y="123" text-anchor="middle" font-size="18" font-weight="900" fill="#FFFFFF">1</text>
  <circle cx="601" cy="115" r="28" fill="#1E40AF"/>
  <text x="601" y="123" text-anchor="middle" font-size="18" font-weight="900" fill="#FFFFFF">2</text>
  <circle cx="997" cy="115" r="28" fill="#65A30D"/>
  <text x="997" y="123" text-anchor="middle" font-size="18" font-weight="900" fill="#FFFFFF">3</text>

  <!-- ステップ1 -->
  <text x="205" y="165" text-anchor="middle" font-size="16" font-weight="900" fill="#1E40AF">壁の特定と依頼スコープ定義</text>
  <text x="205" y="192" text-anchor="middle" font-size="13" fill="#6B7280">期間：1〜2週間</text>
  <!-- 区切り線 -->
  <line x1="60" y1="205" x2="350" y2="205" stroke="#E5E7EB" stroke-width="1.5"/>
  <!-- 本文 -->
  <text x="60" y="232" font-size="13.5" fill="#374151">PoCのどの段階で止まっているか（技術・</text>
  <text x="60" y="254" font-size="13.5" fill="#374151">現場・組織）を特定。FDEに任せるスコープ</text>
  <text x="60" y="276" font-size="13.5" fill="#374151">（本番移行・研修・KPI設計）を明文化し、</text>
  <text x="60" y="298" font-size="13.5" fill="#374151">社内の意思決定者を確定させる。</text>
  <!-- チェックリスト -->
  <text x="60" y="332" font-size="13" fill="#1E40AF" font-weight="700">✓ PoC報告書の共有</text>
  <text x="60" y="354" font-size="13" fill="#1E40AF" font-weight="700">✓ 本番化ゴール・KPIの仮設定</text>
  <text x="60" y="376" font-size="13" fill="#1E40AF" font-weight="700">✓ FDEへのキックオフMTG</text>

  <!-- 矢印1→2 -->
  <polygon points="382,245 414,260 382,275" fill="#1E40AF"/>
  <line x1="370" y1="260" x2="412" y2="260" stroke="#1E40AF" stroke-width="3"/>

  <!-- ステップ2 -->
  <text x="601" y="165" text-anchor="middle" font-size="16" font-weight="900" fill="#1E40AF">本番移行設計とシステム実装</text>
  <text x="601" y="192" text-anchor="middle" font-size="13" fill="#6B7280">期間：3〜6週間</text>
  <line x1="456" y1="205" x2="746" y2="205" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="456" y="232" font-size="13.5" fill="#374151">FDEがPoC資産（コード・モデル・データ）</text>
  <text x="456" y="254" font-size="13.5" fill="#374151">を受け取り、本番グレードのAPI設計・インフラ</text>
  <text x="456" y="276" font-size="13.5" fill="#374151">構成・既存システム連携を実装。業務フローへの</text>
  <text x="456" y="298" font-size="13.5" fill="#374151">組み込み設計と現場UIの調整も担当。</text>
  <text x="456" y="332" font-size="13" fill="#1E40AF" font-weight="700">✓ API連携・インフラ実装</text>
  <text x="456" y="354" font-size="13" fill="#1E40AF" font-weight="700">✓ 業務フロー変更設計</text>
  <text x="456" y="376" font-size="13" fill="#1E40AF" font-weight="700">✓ テスト環境での動作確認</text>

  <!-- 矢印2→3 -->
  <polygon points="778,245 810,260 778,275" fill="#65A30D"/>
  <line x1="766" y1="260" x2="808" y2="260" stroke="#65A30D" stroke-width="3"/>

  <!-- ステップ3 -->
  <text x="997" y="165" text-anchor="middle" font-size="16" font-weight="900" fill="#065F46">現場研修と運用定着フォロー</text>
  <text x="997" y="192" text-anchor="middle" font-size="13" fill="#6B7280">期間：2〜4週間</text>
  <line x1="852" y1="205" x2="1142" y2="205" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="852" y="232" font-size="13.5" fill="#374151">現場担当者へのハンズオン研修（3回が目安）・</text>
  <text x="852" y="254" font-size="13.5" fill="#374151">FAQ・操作マニュアル整備。運用開始後4週間</text>
  <text x="852" y="276" font-size="13.5" fill="#374151">のフォロー期間中に不具合対応・改善提案を</text>
  <text x="852" y="298" font-size="13.5" fill="#374151">行い、KPI計測の仕組みを引き渡す。</text>
  <text x="852" y="332" font-size="13" fill="#065F46" font-weight="700">✓ 現場担当者ハンズオン研修</text>
  <text x="852" y="354" font-size="13" fill="#065F46" font-weight="700">✓ 操作マニュアル・FAQ整備</text>
  <text x="852" y="376" font-size="13" fill="#065F46" font-weight="700">✓ KPI計測・定着確認で引き渡し</text>

  <!-- 期間・費用バー -->
  <rect x="40" y="432" width="1124" height="36" fill="#EFF6FF" rx="10"/>
  <text x="600" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">目安：合計1〜2ヶ月｜費用 20〜50万円（スポット外注・単発依頼）｜継続契約不要</text>
</svg>
